 ____ promotion of white middle-class ideas and lifestyles risks [34] ____ children from minority groups. This can give white middle-class children a sense of [35] ____ or privilege,\" Dr. Adam said.","options":[{"id":"A","text":"alienating"},{"id":"B","text":"appreciation"},{"id":"C","text":"bias"},{"id":"D","text":"fraud"},{"id":"E","text":"housed"},{"id":"F","text":"investigated"},{"id":"G","text":"overwhelming"},{"id":"H","text":"portraying"},{"id":"I","text":"representation"},{"id":"J","text":"safeguarded"},{"id":"K","text":"secondary"},{"id":"L","text":"superiority"},{"id":"M","text":"temperament"},{"id":"N","text":"tentative"},{"id":"O","text":"threshold"}],"correctAnswer":"L","hint":"先看第 35 空前后的句子成分，再结合所在段语境；词库中每个词最多使用一次。","explanation":"来源答案为 L（superiority）。本空所在句：This can give white middle-class children a sense of [35] ____ or privilege,\" Dr.\n将本空替换为 superiority 后，检查它与前后主语、谓语、宾语或修饰成分的关系，并与整段论述方向核对。此讲解为自动上下文定位，不是逐题人工详解。","authenticity":"past_exam","sourceId":"cet6-2021-06-1-nonlistening","referenceAnswer":"","rubric":[]},{"id":"cet6-2021-06-1-nonlistening-q36","canonicalId":"lazynote-cet6-2021-06-1-q36","number":36,"level":"CET6","type":"single_choice","skill":"reading","section":"reading_matching","prompt":"Marconi was central to our present-day understanding of communication.","passage":"How Marconi Gave Us the Wireless World\n\nA) A hundred years before iconic figures like Bill Gates and Steve Jobs permeated our lives, an Irish-Italian inventor laid the foundation of the communication explosion of the 21st century. Guglielmo Marconi was arguably the first truly global figure in modern communication. Not only was he the first to communicate globally, he was the first to think globally about communication. Marconi may not have been the greatest inventor of his time, but more than anyone else, he brought about a fundamental shift in the way we communicate.\n\nB) Today's globally networked media and communication system has its origins in the 19th century, when, for the first time, messages were sent electronically across great distances. The telegraph, the telephone, and radio were the obvious predecessors of the Internet, iPods, and mobile phones. What made the link from then to now was the development of wireless communication. Marconi was the first to develop and perfect this system, using the recently-discovered \"air waves\" that make up the electromagnetic spectrum.\n\nC) Between 1896, when he applied for his first patent in England at the age of 22, and his death in Italy in 1937, Marconi was at the center of every major innovation in electronic communication. He was also a skilled and sophisticated organizer, an entrepreneurial innovator, who mastered the use of corporate strategy, media relations, government lobbying, international diplomacy, patents, and prosecution. Marconi was really interested in only one thing: the extension of mobile, personal, long-distance communication to the ends of the earth (and beyond, if we can believe some reports). Some like to refer to him as a genius, but if there was any genius to Marconi it was this vision.\n\nD) In 1901 he succeeded in signaling across the Atlantic, from the west coast of England to Newfoundland in the USA, despite the claims of science that it could not be done. In 1924 he convinced the British government to encircle the world with a chain of wireless stations using the latest technology that he had devised, shortwave radio. There are some who say Marconi lost his edge when commercial broadcasting came along; he didn't see that radio could or should be used to frivolous(无聊的) ends. In one of his last public speeches, a radio broadcast to the United States in March 1937, he deplored that broadcasting had become a one-way means of communication and foresaw it moving in another direction, toward communication as a means of exchange. That was visionary genius.\n\nE) Marconi's career was devoted to making wireless communication happen cheaply, efficiently, smoothly, and with an elegance that would appear to be intuitive and uncomplicated to the user-friendly, if you will. There is a direct connection from Marconi to today's social media, search engines, and program streaming that can best be summed up by an admittedly provocative exclamation: the 20th century did not exist. In a sense, Marconi's vision jumped from his time to our own.\n\nF) Marconi invented the idea of global communication—or, more straightforwardly, globally networked, mobile, wireless communication. Initially, this was wireless Morse code telegraphy(电报通讯), the principal communication technology of his day. Marconi was the first to develop a practical method for wireless telegraphy using radio waves. He borrowed technical details from many sources, but what set him apart was a self-confident vision of the power of communication technology on the one hand, and, on the other, of the steps that needed to be taken to consolidate his own position as a player in that field. Tracing Marconi's lifeline leads us into the story of modern communication itself. There were other important figures, but Marconi towered over them all in reach, power, and influence, as well as in the grip he had on the popular imagination of his time. Marconi was quite simply the central figure in the emergence of a modern understanding of communication.\n\nG) In his lifetime, Marconi foresaw the development of television and the fax machine, GPS, radar, and the portable hand-held telephone. Two months before he died, newspapers were reporting that he was working on a \"death ray,\" and that he had \"killed a rat with an intricate device at a distance of three feet.\" By then, anything Marconi said or did was newsworthy. Stock prices rose or sank according to his pronouncements. If Marconi said he thought it might rain, there was likely to be a run on umbrellas.\n\nH) Marconi's biography is also a story about choices and the motivations behind them. At one level, Marconi could be fiercely autonomous and independent of the constraints of his own social class. On another scale, he was a perpetual outsider. Wherever he went, he was never \"of\" the group; he was always the \"other,\" considered foreign in Britain, British in Italy, and \"not American\" in the United States. At the same time, he also suffered tremendously from a need for acceptance that drove, and sometimes stained, every one of his relationships.\n\nI) Marconi placed a permanent stamp on the way we live. He was the first person to imagine a practical application for the wireless spectrum, and to develop it successfully into a global communication system—in both terms of the word; that is, worldwide and all-inclusive. He was able to do this because of a combination of factors—most important, timing and opportunity—but the single-mindedness and determination with which he carried out his self-imposed mission was fundamentally character-based; millions of Marconi's contemporaries had the same class, gender, race, and colonial privilege as he, but only a handful did anything with it. Marconi needed to achieve the goal that was set in his mind as an adolescent; by the time he reached adulthood, he understood, intuitively, that in order to have an impact he had to both develop an independent economic base and align himself with political power. Disciplined, uncritical loyalty to political power became his compass for the choices he had to make.\n\nJ) At the same time, Marconi was uncompromisingly independent intellectually. Shortly after Marconi's death, the nuclear physicist Enrico Fermi—soon to be the developer of the Manhattan Project—wrote that Marconi proved that theory and experimentation were complementary features of progress. \"Experience can rarely, unless guided by a theoretical concept, arrive at results of any great significance…on the other hand, an excessive trust in theoretical conviction would have prevented Marconi from persisting in experiments which were destined to bring about a revolution in the technique of radio-communications.\" In other words, Marconi had the advantage of not being burdened by preconceived assumptions.\n\nK) The most controversial aspect of Marconi's life—and the reason why there has been no satisfying biography of Marconi until now—was his uncritical embrace of Benito Mussolini. At first this was not problematic for him. But as the regressive(倒退的) nature of Mussolini's regime became clear, he began to suffer a crisis of conscience. However, after a lifetime of moving within the circles of power, he was unable to break with authority, and served Mussolini faithfully (as president of Italy's national research council and royal academy, as well as a member of the Fascist Grand Council) until the day he died—conveniently—in 1937, shortly before he would have had to take a stand in the conflict that consumed a world that he had, in part, created.","options":[{"id":"A","text":"A 段"},{"id":"B","text":"B 段"},{"id":"C","text":"C 段"},{"id":"D","text":"D 段"},{"id":"E","text":"E 段"},{"id":"F","text":"F 段"},{"id":"G","text":"G 段"},{"id":"H","text":"H 段"},{"id":"I","text":"I 段"},{"id":"J","text":"J 段"},{"id":"K","text":"K 段"}],"correctAnswer":"F","hint":"标出题干中的专名、时间和关键动作，再寻找表达同一事实的段落，注意同义改写。","explanation":"来源答案对应 F 段。题干：Marconi was central to our present-day understanding of communication.\n核对该段原文：Marconi invented the idea of global communication—or, more straightforwardly, globally networked, mobile, wireless communication. Initially, this was wireless Morse code telegraphy(电报通讯), the principal communication technology of his day. Marconi was the first to develop a practical method for wireless telegraphy using radio waves. He borrowed technical details from many sources, but what set him apart was a self-confident vision of the power of communication technology on the one hand, and, on the other, of the steps that needed to be taken to consolidate his own position as a player in that field. Tracing Marconi's lifeline nd influence, as well as in the grip he had on the popular imagination of his time. Marconi was quite simply the central figure in the emergence of a modern understanding of communication.\n\nG) In his lifetime, Marconi foresaw the development of television and the fax machine, GPS, radar, and the portable hand-held telephone. Two months before he died, newspapers were reporting that he was working on a \"death ray,\" and that he had \"killed a rat with an intricate device at a distance of three feet.\" By then, anything Marconi said or did was newsworthy. Stock prices rose or sank according to his pronouncements. If Marconi said he thought it might rain, there was likely to be a run on umbrellas.\n\nH) Marconi's biography is also a story about choices and the motivations behind them. At one level, Marconi could be fiercely autonomous and independent of the constraints of his own social class. On another scale, he was a perpetual outsider. Wherever he went, he was never \"of\" the group; he was always the \"other,\" considered foreign in Britain, British in Italy, and \"not American\" in the United States. At the same time, he also suffered tremendously from a need for acceptance that drove, and sometimes stained, every one of his relationships.\n\nI) Marconi placed a permanent stamp on the way we live. He was the first person to imagine a practical application for the wireless spectrum, and to develop it successfully into a global communication system—in both terms of the word; that is, worldwide and all-inclusive. He was able to do this because of a combination of factors—most important, timing and opportunity—but the single-mindedness and determination with which he carried out his self-imposed mission was fundamentally character-based; millions of Marconi's contemporaries had the same class, gender, race, and colonial privilege as he, but only a handful did anything with it. Marconi needed to achieve the goal that was set in his mind as an adolescent; by the time he reached adulthood, he understood, intuitively, that in order to have an impact he had to both develop an independent economic base and align himself with political power. Disciplined, uncritical loyalty to political power became his compass for the choices he had to make.\n\nJ) At the same time, Marconi was uncompromisingly independent intellectually. Shortly after Marconi's death, the nuclear physicist Enrico Fermi—soon to be the developer of the Manhattan Project—wrote that Marconi proved that theory and experimentation were complementary features of progress. \"Experience can rarely, unless guided by a theoretical concept, arrive at results of any great significance…on the other hand, an excessive trust in theoretical conviction would have prevented Marconi from persisting in experiments which were destined to bring about a revolution in the technique of radio-communications.\" In other words, Marconi had the advantage of not being burdened by preconceived assumptions.\n\nK) The most controversial aspect of Marconi's life—and the reason why there has been no satisfying biography of Marconi until now—was his uncritical embrace of Benito Mussolini. At first this was not problematic for him. But as the regressive(倒退的) nature of Mussolini's regime became clear, he began to suffer a crisis of conscience. However, after a lifetime of moving within the circles of power, he was unable to break with authority, and served Mussolini faithfully (as president of Italy's national research council and royal academy, as well as a member of the Fascist Grand Council) until the day he died—conveniently—in 1937, shortly before he would have had to take a stand in the conflict that consumed a world that he had, in part, created.","options":[{"id":"A","text":"A 段"},{"id":"B","text":"B 段"},{"id":"C","text":"C 段"},{"id":"D","text":"D 段"},{"id":"E","text":"E 段"},{"id":"F","text":"F 段"},{"id":"G","text":"G 段"},{"id":"H","text":"H 段"},{"id":"I","text":"I 段"},{"id":"J","text":"J 段"},{ ower of communication technology on the one hand, and, on the other, of the steps that needed to be taken to consolidate his own position as a player in that field. Tracing Marconi's lifeline leads us into the story of modern communication itself. There were other important figures, but Marconi towered over them all in reach, power, and influence, as well as in the grip he had on the popular imagination of his time. Marconi was quite simply the central figure in the emergence of a modern understanding of communication.\n\nG) In his lifetime, Marconi foresaw the development of television and the fax machine, GPS, radar, and the portable hand-held telephone. Two months before he died, newspapers were reporting that he was working on a \"death ray,\" and that he had \"killed a rat with an intricate device at a distance of three feet.\" By then, anything Marconi said or did was newsworthy. Stock prices rose or sank according to his pronouncements. If Marconi said he thought it might rain, there was likely to be a run on umbrellas.\n\nH) Marconi's biography is also a story about choices and the motivations behind them. At one level, Marconi could be fiercely autonomous and independent of the constraints of his own social class. On another scale, he was a perpetual outsider. Wherever he went, he was never \"of\" the group; he was always the \"other,\" considered foreign in Britain, British in Italy, and \"not American\" in the United States. At the same time, he also suffered tremendously from a need for acceptance that drove, and sometimes stained, every one of his relationships.\n\nI) Marconi placed a permanent stamp on the way we live. He was the first person to imagine a practical application for the wireless spectrum, and to develop it successfully into a global communication system—in both terms of the word; that is, worldwide and all-inclusive. He was able to do this because of a combination of factors—most important, timing and opportunity—but the single-mindedness and determination with which he carried out his self-imposed mission was fundamentally character-based; millions of Marconi's contemporaries had the same class, gender, race, and colonial privilege as he, but only a handful did anything with it. Marconi needed to achieve the goal that was set in his mind as an adolescent; by the time he reached adulthood, he understood, intuitively, that in order to have an impact he had to both develop an independent economic base and align himself with political power. Disciplined, uncritical loyalty to political power became his compass for the choices he had to make.\n\nJ) At the same time, Marconi was uncompromisingly independent intellectually. Shortly after Marconi's death, the nuclear physicist Enrico Fermi—soon to be the developer of the Manhattan Project—wrote that Marconi proved that theory and experimentation were complementary features of progress. \"Experience can rarely, unless guided by a theoretical concept, arrive at results of any great significance…on the other hand, an excessive trust in theoretical conviction would have prevented Marconi from persisting in experiments which were destined to bring about a revolution in the technique of radio-communications.\" In other words, Marconi had the advantage of not being burdened by preconceived assumptions.\n\nK) The most controversial aspect of Marconi's life—and the reason why there has been no satisfying biography of Marconi until now—was his uncritical embrace of Benito Mussolini. At first this was not problematic for him. But as the regressive(倒退的) nature of Mussolini's regime became clear, he began to suffer a crisis of conscience. However, after a lifetime of moving within the circles of power, he was unable to break with authority, and served Mussolini faithfully (as president of Italy's national research council and royal academy, as well as a member of the Fascist Grand Council) until the day he died—conveniently—in 1937, shortly before he would have had to take a stand in the conflict that consumed a world that he had, in part, created.","options":[{"id":"A","text":"A 段"},{"id":"B","text":"B 段"},{"id":"C","text":"C 段"},{"id":"D","text":"D 段"},{"id":"E","text":"E 段"},{"id":"F","text":"F 段"},{"id":"G","text":"G 段"},{"id":"H","text":"H 段"},{"id":"I","text":"I 段"},{"id":"J","text":"J 段"},{"id":"K","text":"K 段"}],"correctAnswer":"G","hint":"标出题干中的专名、时间和关键动作，再寻找表达同一事实的段落，注意同义改写。","explanation":"来源答案对应 G 段。题干：In his later years, Marconi exerted a tremendous influence on all aspects of people's life.\n核对该段原文：In his lifetime, Marconi foresaw the development of television and the fax machine, GPS, radar, and the portable hand-held telephone. Two months before he died, newspapers were reporting that he was working on a \"death ray,\" and that he had \"killed a rat with an intricate device at a distance of three feet.\" By then, anything Marconi said or did was newsworthy. Stock prices rose or sank according to his pronouncements. If Marconi said he thought it might rain, there was likely to be a run on umbrellas.\n比较题干与段落中的人物、时间、对象和动作是否一致；关键词相似本身不能证明匹配。此讲解为自动段落定位，不是逐题人工详解。","authenticity":"past_exam","sourceId":"cet6-2021-06-1-nonlistening","referenceAnswer":"","rubric":[]},{"id":"cet6-2021-06-1-nonlistening-q44","canonicalId":"lazynote-cet6-2021-06-1-q44","number":44,"level":"CET6","type":"single_choice","skill":"reading","section":"reading_matching","prompt":"What connected the 19th century and our present time was the development of wireless communication.","passage":"How Marconi Gave Us the Wireless World\n\nA) A hundred years before iconic figures like Bill Gates and Steve Jobs permeated our lives, an Irish-Italian inventor laid the foundation of the communication explosion of the 21st century. Guglielmo Marconi was arguably the first truly global figure in modern communication. Not only was he the first to communicate globally, he was the first to think globally about communication. Marconi may not have been the greatest inventor of his time, but more than anyone else, he brought about a fundamental shift in the way we communicate.\n\nB) Today's globally networked media and communication system has its origins in the 19th century, when, for the first time, messages were sent electronically across great distances. The telegraph, the telephone, and radio were the obvious predecessors of the Internet, iPods, and mobile phones. What made the link from then to now was the development of wireless communication. Marconi was the first to develop and perfect this system, using the recently-discovered \"air waves\" that make up the electromagnetic spectrum.\n\nC) Between 1896, when he applied for his first patent in England at the age of 22, and his death in Italy in 1937, Marconi was at the center of every major innovation in electronic communication. He was also a skilled and sophisticated organizer, an entrepreneurial innovator, who mastered the use of corporate strategy, media relations, government lobbying, international diplomacy, patents, and prosecution. Marconi was really interested in only one thing: the extension of mobile, personal, long-distance communication to the ends of the earth (and beyond, if we can believe some reports). Some like to refer to him as a genius, but if there was any genius to Marconi it was this vision.\n\nD) In 1901 he succeeded in signaling across the Atlantic, from the west coast of England to Newfoundland in the USA, despite the claims of science that it could not be done. In 1924 he convinced the British government to encircle the world with a chain of wireless stations using the latest technology that he had devised, shortwave radio. There are some who say Marconi lost his edge when commercial broadcasting came along; he didn't see that radio could or should be used to frivolous(无聊的) ends. In one of his last public speeches, a radio broadcast to the United States in March 1937, he deplored that broadcasting had become a one-way means of communication and foresaw it moving in another direction, toward communication as a means of exchange. That was visionary genius.\n\nE) Marconi's career was devoted to making wireless communication happen cheaply, efficiently, smoothly, and with an elegance that would appear to be intuitive and uncomplicated to the user-friendly, if you will. There is a direct connection from Marconi to today's social media, search engines, and program streaming that can best be summed up by an admittedly provocative exclamation: the 20th century did not exist. In a sense, Marconi's vision jumped from his time to our own.\n\nF) Marconi invented the idea of global communication—or, more straightforwardly, globally networked, mobile, wireless communication. Initially, this was wireless Morse code telegraphy(电报通讯), the principal communication technology of his day. Marconi was the first to develop a practical method for wireless telegraphy using radio waves. He borrowed technical details from many sources, but what set him apart was a self-confident vision of the power of communication technology on the one hand, and, on the other, of the steps that needed to be taken to consolidate his own position as a player in that field. Tracing Marconi's lifeline leads us into the story of modern communication itself. There were other important figures, but Marconi towered over them all in reach, power, and influence, as well as in the grip he had on the popular imagination of his time. Marconi was quite simply the central figure in the emergence of a modern understanding of communication.\n\nG) In his lifetime, Marconi foresaw the development of television and the fax machine, GPS, radar, and the portable hand-held telephone. Two months before he died, newspapers were reporting that he was working on a \"death ray,\" and that he had \"killed a rat with an intricate device at a distance of three feet.\" By then, anything Marconi said or did was newsworthy. Stock prices rose or sank according to his pronouncements. If Marconi said he thought it might rain, there was likely to be a run on umbrellas.\n\nH) Marconi's biography is also a story about choices and the motivations behind them. At one level, Marconi could be fiercely autonomous and independent of the constraints of his own social class. On another scale, he was a perpetual outsider. Wherever he went, he was never \"of\" the group; he was always the \"other,\" considered foreign in Britain, British in Italy, and \"not American\" in the United States. At the same time, he also suffered tremendously from a need for acceptance that drove, and sometimes stained, every one of his relationships.\n\nI) Marconi placed a permanent stamp on the way we live. He was the first person to imagine a practical application for the wireless spectrum, and to develop it successfully into a global communication system—in both terms of the word; that is, worldwide and all-inclusive. He was able to do this because of a combination of factors—most important, timing and opportunity—but the single-mindedness and determination with which he carried out his self-imposed mission was fundamentally character-based; millions of Marconi's contemporaries had the same class, gender, race, and colonial privilege as he, but only a handful did anything with it. Marconi needed to achieve the goal that was set in his mind as an adolescent; by the time he reached adulthood, he understood, intuitively, that in order to have an impact he had to both develop an independent economic base and align himself with political power. Disciplined, uncritical loyalty to political power became his compass for the choices he had to make.\n\nJ) At the same time, Marconi was uncompromisingly independent intellectually. Shortly after Marconi's death, the nuclear physicist Enrico Fermi—soon to be the developer of the Manhattan Project—wrote that Marconi proved that theory and experimentation were complementary features of progress. \"Experience can rarely, unless guided by a e of a combination of factors—most important, timing and opportunity—but the single-mindedness and determination with which he carried out his self-imposed mission was fundamentally character-based; millions of Marconi's contemporaries had the same class, gender, race, and colonial privilege as he, but only a handful did anything with it. Marconi needed to achieve the goal that was set in his mind as an adolescent; by the time he reached adulthood, he understood, intuitively, that in order to have an impact he had to both develop an independent economic base and align himself with political power. Disciplined, uncritical loyalty to political power became his compass for the choices he had to make.\n\nJ) At the same time, Marconi was uncompromisingly independent intellectually. Shortly after Marconi's death, the nuclear physicist Enrico Fermi—soon to be the developer of the Manhattan Project—wrote that Marconi proved that theory and experimentation were complementary features of progress. \"Experience can rarely, unless guided by a theoretical concept, arrive at results of any great significance…on the other hand, an excessive trust in theoretical conviction would have prevented Marconi from persisting in experiments which were destined to bring about a revolution in the technique of radio-communications.\" In other words, Marconi had the advantage of not being burdened by preconceived assumptions.\n\nK) The most controversial aspect of Marconi's life—and the reason why there has been no satisfying biography of Marconi until now—was his uncritical embrace of Benito Mussolini. At first this was not problematic for him. But as the regressive(倒退的) nature of Mussolini's regime became clear, he began to suffer a crisis of conscience. However, after a lifetime of moving within the circles of power, he was unable to break with authority, and served Mussolini faithfully (as president of Italy's national research council and royal academy, as well as a member of the Fascist Grand Council) until the day he died—conveniently—in 1937, shortly before he would have had to take a stand in the conflict that consumed a world that he had, in part, created.","options":[{"id":"A","text":"A 段"},{"id":"B","text":"B 段"},{"id":"C","text":"C 段"},{"id":"D","text":"D 段"},{"id":"E","text":"E 段"},{"id":"F","text":"F 段"},{"id":"G","text":"G 段"},{"id":"H","text":"H 段"},{"id":"I","text":"I 段"},{"id":"J","text":"J 段"},{"id":"K","text":"K 段"}],"correctAnswer":"H","hint":"标出题干中的专名、时间和关键动作，再寻找表达同一事实的段落，注意同义改写。","explanation":"来源答案对应 H 段。题干：Despite his autonomy, Marconi felt alienated and suffered from a lack of acceptance.\n核对该段原文：Marconi's biography is also a story about choices and the motivations behind them. At one level, Marconi could be fiercely autonomous and independent of the constraints of his own social class. On another scale, he was a perpetual outsider. Wherever he went, he was never \"of\" the group; he was always the \"other,\" considered foreign in Britain, British in Italy, and \"not American\" in the United States. At the same time, he also suffered tremendously from a need for acceptance that drove, and sometimes stained, every one of his relationships.\n比较题干与段落中的人物、时间、对象和动作是否一致；关键词相似本身不能证明匹配。此讲解为自动段落定位，不是逐题人工详解。","authenticity":"past_exam","sourceId":"cet6-2021-06-1-nonlistening","referenceAnswer":"","rubric":[]},{"id":"cet6-2021-06-1-nonlistening-q46","canonicalId":"lazynote-cet6-2021-06-1-q46","number":46,"level":"CET6","type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What did a recent research paper claim?","passage":"Humans are fascinated by the source of their failings and virtues: This preoccupation inevitably leads to an old debate: whether nature or nurture moulds us more. A revolution in genetics has poised this as a modern political question about the character of our society: if personalities are hard-wired into our genes, what can governments do to help us? It feels morally questionable, yet claims of genetic selection by intelligence are making headlines.\n\nThis is down to \"hereditarian\"(遗传论的) science and a recent paper claimed \"differences in exam performance between pupils attending selective and non-selective schools mirror the genetic differences between them\". With such an assertion, the work was predictably greeted by a lot of absurd claims about \"genetics determining academic success\". What the research revealed was the rather less surprising result: the educational benefits of selective schools largely disappear once pupils' inborn ability and socio-economic background were taken into account. It is a glimpse of the blindingly obvious—and there's nothing to back strongly either a hereditary or environmental argument.\n\nYet the paper does say children are \"unintentionally genetically selected\" by the school system. Central to hereditarian science is a tall claim: that identifiable variations in genetic sequences can predict an individual's aptness to learn, reason and solve problems. This is problematic on many levels. A teacher could not seriously tell a parent their child has a low genetic tendency to study when external factors clearly exist. Unlike-minded academics say the inheritability of human traits is scientifically unsound. At best there is a weak statistical association and not a causal link between DNA and intelligence. Yet sophisticated statistics are used to create an intimidatory atmosphere of scientific certainty.\n\nWhile there's an undoubted genetic basis to individual difference, it is wrong to think that socially defined groups can be genetically accounted for. The fixation on genes as destiny is surely false too. Medical predictability can rarely be based on DNA alone; the environment matters too. Something as complex as intellect is likely to be affected by many factors beyond genes. If hereditarians want to advance their cause it will require more balanced interpretation and not just acts of advocacy.\n\nGenetic selection is a way of exerting influence over others, \"the ultimate collective control of human destinies,\" as writer H. G. Wells put it. Knowledge becomes power and power requires a sense of responsibility. In understanding cognitive ability, we must not elevate discrimination to a science, allowing people to climb the ladder of life only as far as their cells might suggest. This will need a more sceptical eye on the science. As technology progresses, we all have a duty to make sure that we shape a future that we would want to find ourselves in.","options":[{"id":"A","text":"The type of school students attend makes a difference to their future."},{"id":"B","text":"Genetic differences between students are far greater than supposed."},{"id":"C","text":"The advantages of selective schools are too obvious to ignore."},{"id":"D","text":"Students' academic performance is determined by their genes."}],"correctAnswer":"D","hint":"用题干中的对象和核心动作定位相关段落，再比较四个选项的范围与原文逻辑。","explanation":"来源答案为 D：Students' academic performance is determined by their genes.\n关键词检索定位到第 2 段的候选相关句：This is down to \"hereditarian\"(遗传论的) science and a recent paper claimed \"differences in exam performance between pupils attending selective and non-selective schools mirror the genetic differences between them\".\n请结合该句前后文核对选项的主体、程度、范围、时间和因果关系；此句为自动检索候选，不能替代整段理解，也不是逐题人工详解。","authenticity":"past_exam","sourceId":"cet6-2021-06-1-nonlistening","referenceAnswer":"","rubric":[]},{"id":"cet6-2021-06-1-nonlistening-q47","canonicalId":"lazynote-cet6-2021-06-1-q47","number":47,"level":"CET6","type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author think of the recent research?","passage":"Humans are fascinated by the source of their failings and virtues: This preoccupation inevitably leads to an old debate: whether nature or nurture moulds us more. A revolution in genetics has poised this as a modern political question about the character of our society: if personali ced tourist taxes.\n\nThat the UK lags behind is due to our weak, by international standards, local government, as well as the opposition to taxes and regulation of our aggressively pro-market ruling party. Some UK cities have lobbied without success for the power to levy a charge on visitors. Such levies are no universal remedy as the amounts raised would be tiny compared with what has been taken away by central government since 2010. Still, it is to be hoped that the Scottish government's bold move will prompt others to act. There is no reason why visitors to the UK, or domestic tourists on holiday in hotspots such as Cornwall, should be exempt from taxation-particularly when vital local services including waste collection, park maintenance and arts and culture spending are under unprecedented strain.\n\nOn the contrary, compelling tourists to make a financial contribution to the places they visit beyond their personal consumption should be part of a wider cultural shift. Westerners with disposable incomes have often behaved as if they have a right to go wherever they choose with little regard for the consequences. Just as the environmental harm caused by aviation and other transport must come under far greater scrutiny, the social cost of tourism must also be confronted. This includes the impact of short-term lets on housing costs and quality of life for residents. Several European capitals, including Paris and Berlin, are leading a campaign for tougher regulation by the European Union. It also includes the impact of overcrowding, litter and the kinds of behaviour associated with noisy parties.\n\nThere is no \"one size fits all\" solution to this problem. The existence of new revenue streams for some but not all councils is complicated, and businesses are often opposed, fearing higher costs will make them uncompetitive. But those places that want them must be given the chance to make tourist taxes work.","options":[{"id":"A","text":"They don't seem to care about et ruling party. Some UK cities have lobbied without success for the power to levy a charge on visitors. Such levies are no universal remedy as the amounts raised would be tiny compared with what has been taken away by central government since 2010. Still, it is to be hoped that the Scottish government's bold move will prompt others to act. There is no reason why visitors to the UK, or domestic tourists on holiday in hotspots such as Cornwall, should be exempt from taxation-particularly when vital local services including waste collection, park maintenance and arts and culture spending are under unprecedented strain.\n\nOn the contrary, compelling tourists to make a financial contribution to the places they visit beyond their personal consumption should be part of a wider cultural shift. Westerners with disposable incomes have often behaved as if they have a right to go wherever they choose with little regard for the consequences. Just as the environmental harm caused by aviation and other transport must come under far greater scrutiny, the social cost of tourism must also be confronted. This includes the impact of short-term lets on housing costs and quality of life for residents. Several European capitals, including Paris and Berlin, are leading a campaign for tougher regulation by the European Union. It also includes the impact of overcrowding, litter and the kinds of behaviour associated with noisy parties.\n\nThere is no \"one size fits all\" solution to this problem. The existence of new revenue streams for some but not all councils is complicated, and businesses are often opposed, fearing higher costs will make them uncompetitive. But those places that want them must be given the chance to make tourist taxes work.","options":[{"id":"A","text":"Supportive."},{"id":"B","text":"Skeptical."},{"id":"C","text":"Divided."},{"id":"D","text":"Unclear."}],"correctAnswer":"C","hint":"用题干中的对象和核心动作定位相关段落，再比较四个选项的范围与原文逻辑。","explanation":"来源答案为 C：Divided.\n关键词检索定位到第 1 段的候选相关句：Scottish councils are set to be the first in the UK with the power to levy charges on visitors, with Edinburgh likely to lead the way.\n请结合该句前后文核对选项的主体、程度、范围、时间和因果关系；此句为自动检索候选，不能替代整段理解，也不是逐题人工详解。","authenticity":"past_exam","sourceId":"cet6-2021-06-1-nonlistening","referenceAnswer":"","rubric":[]},{"id":"cet6-2021-06-1-nonlistening-translation","number":"IV","level":"CET6","type":"short_text_self_check","skill":"translation","section":"translation","prompt":"Directions : For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should write your answer on Answer Sheet 2 .\n\n海南是仅次于台湾的中国第二大岛，是位于中国最南端的省份。海南岛风景秀丽，气候宜人，阳光充足,生物多样，温泉密布，海水清澈，大部分海滩几乎全年都是游泳和日光浴的理想场所，因而被誉为中国的四季花园和度假胜地，每年都吸引了大批中外游客。 海南1988年建省以来，旅游业、服务业、高新技术产业飞速发展,是中国唯一的省级经济特区。在中央政府和全国人民的大力支持下，海南将建成中国最大的自由贸易试验区。","options":[],"correctAnswer":"Hainan is China's second largest island after Taiwan and its southernmost province. With beautiful scenery, a pleasant climate, abundant sunshine, diverse wildlife, numerous hot springs and clear seawater, most of its beaches are ideal for swimming and sunbathing almost all year round. It is therefore known as China's year round garden and holiday destination, attracting large numbers of Chinese and foreign tourists every year. Since Hainan became a province in 1988, tourism, services and high technology industries have developed rapidly. It is China's only provincial level special economic zone. With strong support from the central government and people across the country, Hainan will become China's largest pilot free trade zone.","referenceAnswer":"Hainan is China's second largest island after Taiwan and its southernmost province. With beautiful scenery, a pleasant climate, abundant sunshine, diverse wildlife, numerous hot springs and clear seawater, most of its beaches are ideal for swimming and sunbathing almost all year round. It is therefore known as China's year round garden and holiday destination, attracting large numbers of Chinese and foreign tourists every year. Since Hainan became a province in 1988, tourism, services and high technology industries have developed rapidly. It is China's only provincial level special economic zone. With strong support from the central government and people across the country, Hainan will become China's largest pilot free trade zone.","hint":"第二大岛、最南省份、1988年建省、唯一省级经济特区及未来自贸区要译全。","explanation":"以下为原创参考译文，准确的同义表达也可接受。after Taiwan限定岛屿面积排序；year round和almost all year round分别对应四季与几乎全年。pilot free trade zone对应自由贸易试验区，题面未来规划用will become，不改写成当前完成状态。","rubric":["信息：逐句核对人物、地点、数字、时间、因果和并列信息，避免漏译或增译。","表达：第二大岛、最南省份、1988年建省、唯一省级经济特区及未来自贸区要译全。","语法：检查时态、语态、主谓一致、冠词与单复数，长句按英语逻辑合理拆分。"],"referenceType":"project_authored_reference","guidance":"项目原创参考范文/译文，不是官方唯一答案；允许准确自然的其他表达。","authenticity":"past_exam","sourceId":"cet6-2021-06-1-nonlistening","canonicalId":"cet6-2021-06-1-nonlistening-translation","passage":""}],"answers":[],"drafts":{}},"question":{"id":"cet6-2021-06-1-nonlistening-writing","number":"I","level":"CET6","type":"short_text_self_check","skill":"writing","section":"写作","prompt":"Directions: For this part, you are allowed 30 minutes to write an essay based on the graph below. You should start your essay with a brief description of the graph and comment on China's achievements in urbanization. You should write at least 150 words but no more than 200 words.","options":[],"correctAnswer":"The graph shows a steady rise in China's degree of urbanization from 19.39 percent in 1980 to 60.6 percent in 2019. The figure reached 36.22 percent in 2000 and continued climbing throughout the following years, indicating a major change in where people live.\n\nThis achievement reflects the growth of urban employment, infrastructure and public services. Cities have attracted people seeking educational and professional opportunities, while improved transport has connected communities more closely. Urbanization can also make services easier to provide when planning keeps pace with population growth. However, the increasing proportion of urban residents does not automatically guarantee a better life for everyone. Affordable housing, environmental protection and equal access to education remain essential to the quality of development.\n\nChina's progress should therefore be understood as both an accomplishment and a continuing responsibility. Future urban development needs to focus on residents' actual needs rather than population figures alone. By combining efficient infrastructure with inclusive services and green spaces, cities can turn the growth shown in the graph into lasting improvements in people's daily lives.","referenceAnswer":"The graph shows a steady rise in China's degree of urbanization from 19.39 percent in 1980 to 60.6 percent in 2019. The figure reached 36.22 percent in 2000 and continued climbing throughout the following years, indicating a major change in where people live.\n\nThis achievement reflects the growth of urban employment, infrastructure and public services. Cities have attracted people seeking educational and professional opportunities, while improved transport has connected communities more closely. Urbanization can also make services easier to provide when planning keeps pace with population growth. However, the increasing proportion of urban residents does not automatically guarantee a better life for everyone. Affordable housing, environmental protection and equal access to education remain essential to the quality of development.\n\nChina's progress should therefore be understood as both an accomplishment and a continuing responsibility. Future urban development needs to focus on residents' actual needs rather than population figures alone. By combining efficient infrastructure with inclusive services and green spaces, cities can turn the growth shown in the graph into lasting improvements in people's daily lives.","hint":"先描述1980至2019年城市化率上升，再评论成就、意义和后续发展重点。","explanation":"以下为按本题要求独立写成的原创参考范文，作文没有唯一答案。原图起点19.39%、终点60.6%，2000年为36.22%；首段用少量关键值概括趋势。城市化率是城市人口比例，不是城市数量。评论中的就业和基础设施是合理解释，不是图表直接证明的因果；末段关注发展质量。","rubric":["任务：先描述1980至2019年城市化率上升，再评论成就、意义和后续发展重点。","论证：明确中心观点，用原因、具体例子或经历展开；结尾回应主题。","语言：检查主谓一致、时态、搭配和段落衔接；全文控制在150–200词。"],"referenceType":"project_authored_reference","guidance":"项目原创参考范文/译文，不是官方唯一答案；允许准确自然的其他表达。","authenticity":"past_exam","sourceId":"cet6-2021-06-1-nonlistening","materialImages":[{"url":"https://www.crbuj.icu/campus-api/english-assets/exams/cet6-2021-06-1-writing-chart.jpg","caption":"这张折线图标题为 \" degree of urbanization in China from 1980 to 2019\"，折线从1980年的19.39%开…","width":773,"height":579}],"passage":"原卷图表数据：Degree of Urbanization in China from 1980 to 2019\n年份 | 城镇化率（%）\n1980 | 19.39\n1985 | 23.71\n1990 | 26.41\n1995 | 29.04\n2000 | 36.22\n2005 | 42.99\n2010 | 49.95\n2011 | 51.27\n2012 | 52.57\n2013 | 53.73\n2014 | 54.77\n2015 | 56.10\n2016 | 57.35\n2017 | 58.52\n2018 | 59.58\n2019 | 60.60\n数据逐项人工对照源图抄录，表格用于无图时作答。","canonicalId":"cet6-2021-06-1-nonlistening-writing","numberLabel":"写作 · Part I"},"answer":"","feedback":null,"hint":"","hintLoading":false,"savedNote":"","result":null,"review":[],"navigation":[{"id":"cet6-2021-06-1-nonlistening-writing","index":0,"number":"I","section":"写作","checked":false},{"id":"cet6-2021-06-1-nonlistening-q26","index":1,"number":26,"section":"阅读理解 · 选词填空","checked":false},{"id":"cet6-2021-06-1-nonlistening-q27","index":2,"number":27,"section":"阅读理解 · 选词填空","checked":false},{"id":"cet6-2021-06-1-nonlistening-q28","index":3,"number":28,"section":"阅读理解 · 选词填空","checked":false},{"id":"cet6-2021-06-1-nonlistening-q29","index":4,"number":29,"section":"阅读理解 · 选词填空","checked":false},{"id":"cet6-2021-06-1-nonlistening-q30","index":5,"number":30,"section":"阅读理解 · 选词填空","checked":false},{"id":"cet6-2021-06-1-nonlistening-q31","index":6,"number":31,"section":"阅读理解 · 选词填空","checked":false},{"id":"cet6-2021-06-1-nonlistening-q32","index":7,"number":32,"section":"阅读理解 · 选词填空","checked":false},{"id":"cet6-2021-06-1-nonlis

e; right: -8rpx; top: 22rpx; color: #b091dc; font-size: 25rpx; }\n.fallback { display: block; line-height: 144rpx; text-align: center; color: #b091dc; font-size: 72rpx; }\n.copy { display: flex; flex-direction: column; gap: 10rpx; min-width: 0; }\n.title { font-size: 25rpx; color: #685680; font-weight: 650; }\n.note { font-size: 18rpx; color: #a096af; letter-spacing: 1rpx; }\n.refresh--ready .mahiro { transform: rotate(-8deg) translateY(-5rpx); }\n.refresh--loading .mahiro { animation: mahiro-bounce .65s ease-in-out infinite; }\n.refresh--loading .sparkle { animation: mahiro-sparkle .8s ease-in-out infinite; }\n.refresh--success .mahiro { animation: mahiro-cheer .6s ease-out; }\n.refresh--error .mahiro { transform: rotate(6deg); }\n.refresh--error .title { color: #a96982; }\n@keyframes mahiro-bounce { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10rpx) rotate(4deg); } }\n@keyframes mahiro-sparkle { 0%,100% { opacity: .35; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.2); } }\n@keyframes mahiro-cheer { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-16rpx) rotate(-8deg); } 70% { transform: rotate(6deg); } }\n@media (prefers-reduced-motion: reduce) { .mahiro,.sparkle { animation: none !important; transition: none; } }\n"},"tech-loader":{"template":"<view class=\"loader\" aria-label=\"正在加载\"><view class=\"square\"><view class=\"edge edge--0\"/><view class=\"edge edge--1\"/><view class=\"edge edge--2\"/><view class=\"edge edge--3\"/></view></view>\n","defaults":{},"css":"/* codebykay101/dull-shrimp-28: the four moving edges and orbiting square. */\r\n:host { display:block; }\r\n.loader { height:100rpx; display:flex; align-items:center; justify-content:center; }.square { position:relative; width:64rpx; height:64rpx; border:1rpx solid #d1def2; }.square::before { content:\"\"; position:absolute; width:8rpx; height:8rpx; background:#879edc; box-shadow:0 0 0 5rpx #aebdea22,0 0 12rpx #aebdea66; animation:square-orbit 4s linear infinite; }\r\n.edge { position:absolute; inset:4rpx; overflow:hidden; }.edge--1 { transform:rotate(90deg); }.edge--2 { transform:rotate(180deg); }.edge--3 { transform:rotate(270deg); }.edge::before { content:\"\"; position:absolute; width:100%; height:2rpx; background:#879edc; transform:translateX(-100%); animation:edge-flow 4s linear infinite; }.edge--1::before { animation-delay:1s; }.edge--2::before { animation-delay:2s; }.edge--3::before { animation-delay:3s; }\r\n@keyframes square-orbit { 0%,100% { transform:translate(-4rpx,-4rpx); } 25% { transform:translate(60rpx,-4rpx); } 50% { transform:translate(60rpx,60rpx); } 75% { transform:translate(-4rpx,60rpx); } }\r\n@keyframes edge-flow { 0% { transform:translateX(-100%); } 50%,100% { transform:translateX(100%); } }\r\n@media (prefers-reduced-motion:reduce) { .square::before,.edge::before { animation:none; } }\r\n"},"english-nav":{"template":"<view class=\"english-nav\">\n  <button wx:for=\"{{items}}\" wx:key=\"id\" class=\"nav-item {{current === item.id ? 'is-current' : ''}}\" data-id=\"{{item.id}}\" bindtap=\"switchSection\" hover-class=\"nav-pressed\" aria-label=\"{{item.label}}分区\" aria-current=\"{{current === item.id ? 'page' : ''}}\"><view class=\"nav-indicator\"></view><text class=\"nav-label\">{{item.label}}</text></button>\n</view>\n","defaults":{"items":[{"id":"words","label":"单词","page":"index"},{"id":"papers","label":"真题","page":"papers"},{"id":"challenge","label":"挑战","page":"challenge"},{"id":"rank","label":"榜单","page":"rank"}],"current":"words","level":"CET4"},"css":":host { display:block; }\n.english-nav { position:fixed; z-index:50; left:0; right:0; bottom:0; display:flex; gap:8px; align-items:center; padding:8px 16px calc(8px + env(safe-area-inset-bottom)); background:#fffffffa; border-top:1px solid #e9edf4; box-shadow:0 -4px 18px #41507706; }\n.english-nav button.nav-item { display:flex; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:7px; width

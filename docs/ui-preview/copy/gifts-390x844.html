-delay:2s; }.edge--3::before { animation-delay:3s; }\r\n@keyframes square-orbit { 0%,100% { transform:translate(-4rpx,-4rpx); } 25% { transform:translate(60rpx,-4rpx); } 50% { transform:translate(60rpx,60rpx); } 75% { transform:translate(-4rpx,60rpx); } }\r\n@keyframes edge-flow { 0% { transform:translateX(-100%); } 50%,100% { transform:translateX(100%); } }\r\n@media (prefers-reduced-motion:reduce) { .square::before,.edge::before { animation:none; } }\r\n"},"tech-search":{"template":"<view class=\"poda\"><view class=\"glow\"/><view class=\"dark-border\"/><view class=\"white\"/><view class=\"border\"/><view class=\"main\"><slot/></view></view>\r\n","defaults":{},"css":"/* Lakshay-art/curvy-earwig-22. Original layers retained; responsive native slot. */\n:host { display:block; min-width:0; }\n.poda { position:relative; display:flex; align-items:center; justify-content:center; width:100%; min-height:88rpx; isolation:isolate; }\n.white,.border,.dark-border,.glow { position:absolute; inset:-4rpx; overflow:hidden; border-radius:18rpx; pointer-events:none; }\n.glow { inset:-12rpx; filter:blur(18rpx); opacity:.45; }.dark-border { inset:-7rpx; filter:blur(3rpx); }.white { inset:-2rpx; filter:blur(1rpx); }\n.white::before,.border::before,.dark-border::before,.glow::before { content:\"\"; position:absolute; top:50%; left:50%; width:760rpx; height:760rpx; background-repeat:no-repeat; transform:translate(-50%,-50%) rotate(70deg); animation:search-rotate 8s linear infinite; pointer-events:none; }\n.white::before { background-image:conic-gradient(transparent 0%,#a099d8,transparent 8%,transparent 50%,#dfa2da,transparent 58%); animation-delay:-1s; }.border::before { background-image:conic-gradient(#1c191c,#402fb5 5%,#1c191c 14%,#1c191c 50%,#cf30aa 60%,#1c191c 64%); }\n.dark-border::before { background-image:conic-gradient(transparent,#18116a,transparent 10%,transparent 50%,#6e1b60,transparent 60%); animation-delay:-2s; }.glow::before { background-image:conic-gradient(#000,#402fb5 5

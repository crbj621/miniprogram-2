flex; align-items:center; justify-content:center; }.square { position:relative; width:64rpx; height:64rpx; border:1rpx solid #d1def2; }.square::before { content:\"\"; position:absolute; width:8rpx; height:8rpx; background:#879edc; box-shadow:0 0 0 5rpx #aebdea22,0 0 12rpx #aebdea66; animation:square-orbit 4s linear infinite; }\r\n.edge { position:absolute; inset:4rpx; overflow:hidden; }.edge--1 { transform:rotate(90deg); }.edge--2 { transform:rotate(180deg); }.edge--3 { transform:rotate(270deg); }.edge::before { content:\"\"; position:absolute; width:100%; height:2rpx; background:#879edc; transform:translateX(-100%); animation:edge-flow 4s linear infinite; }.edge--1::before { animation-delay:1s; }.edge--2::before { animation-delay:2s; }.edge--3::before { animation-delay:3s; }\r\n@keyframes square-orbit { 0%,100% { transform:translate(-4rpx,-4rpx); } 25% { transform:translate(60rpx,-4rpx); } 50% { transform:translate(60rpx,60rpx); } 75% { transform:translate(-4rpx,60rpx); } }\r\n@keyframes edge-flow { 0% { transform:translateX(-100%); } 50%,100% { transform:translateX(100%); } }\r\n@media (prefers-reduced-motion:reduce) { .square::before,.edge::before { animation:none; } }\r\n"},"english-nav":{"template":"<view class=\"english-nav\">\n  <button wx:for=\"{{items}}\" wx:key=\"id\" class=\"nav-item {{current === item.id ? 'is-current' : ''}}\" data-id=\"{{item.id}}\" bindtap=\"switchSection\" hover-class=\"nav-pressed\" aria-label=\"{{item.label}}分区\" aria-current=\"{{current === item.id ? 'page' : ''}}\"><view class=\"nav-indicator\"></view><text class=\"nav-label\">{{item.label}}</text></button>\n</view>\n","defaults":{"items":[{"id":"words","label":"单词","page":"index"},{"id":"papers","label":"真题","page":"papers"},{"id":"challenge","label":"挑战","page":"challenge"},{"id":"rank","label":"榜单","page":"rank"}],"current":"words","level":"CET4"},"css":":host { display:block; }\n.english-nav { position:fixed; z-index:50; left:0; right:0; bottom:0; display:flex; gap:8px; align-items:center; padding:8px 16px calc(8px + env(safe-area-inset-bottom)); background:#fffffffa; border-top:1px solid #e9edf4; box-shadow:0 -4px 18px #41507706; }\n.english-nav button.nav-item { display:flex; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:7px; width:auto; min-width:44px; min-height:48px; margin:0; padding:8px 0; line-height:1.4; color:#9097a8; background:transparent; border-radius:12px; }\n.nav-item::after { border:0; }\n.nav-label { font-size:14px; font-weight:600; }\n.nav-indicator { width:20px; height:3px; border-radius:3px; background:transparent; }\n.english-nav button.is-current { color:var(--campus-theme-accent,#6574ca); background:var(--campus-theme-soft,#f1f3fb); }\n.is-current .nav-indicator { background:var(--campus-theme-accent,#6574ca); }\n.nav-pressed { opacity:.65; }\n"}})</script></body></html>

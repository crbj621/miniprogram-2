th allegedly violating a Rhode Island city law against feeding wild animals. The 55-year-old woman's neighbors blame her for making the area's rat problem worse. Newly installed cameras captured several rats active in the middle of the day. Neighbors say that it's even worse during the night. The woman and her parents, who own the home, told reporters that she's being charged for feeding birds. \"Who would have known just loving animals gets you that much trouble,\"she said. It is prohibited to feed any wild animals including birds in Rhode Island City. Nevertheless, while the woman's intention was to feed birds, it is clear that rats were also benefiting. Anthony Moretti, director of the city administration, said he saw more than 20 rats near the woman's home. He said it will take months to get the problem under control.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What did the director of the city administration say at the end of the news report?","passage":"","options":[{"id":"A","text":"It will take time to solve the rat problem."},{"id":"B","text":"All wild animals should be well protected."},{"id":"C","text":"The woman was not to blame for the situation."},{"id":"D","text":"No one should go unpunished for violating law."}],"id":"cet4-2023-06-1-q2","number":2,"level":"CET4","correctAnswer":"A","hint":"关注新闻结尾局长对问题何时能得到控制的判断。","explanation":"A。局长说“it will take months to get the problem under control”，说明解决鼠患需要时间。其余选项转移到保护动物、免责或处罚原则，新闻结尾没有这些结论。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"A woman was charged with allegedly violating a Rhode Island city law against feeding wild animals. The 55-year-old woman's neighbors blame her for making the area's rat problem worse. Newly installed cameras captured several rats active in the middle of the day. Neighbors say that it's even worse during the night. .\"We are looking at Mars realistic situations.\" The application process open Friday and they're not seeking just anybody. The requirements are strict, including a master's degree in a science, engineering or math field or pilot experience. Only American citizens or permanent U. S. residents are acceptable. Applicants must be between 30 and 55 and in good physical health. Attitude is key, said former Canadian astronaut Chris Hadfield. He said the participants need to be super competent, resourceful, and not relying on other people to feel comfortable.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What will the participants in the project eat?","passage":"","options":[{"id":"A","text":"Ready-made food."},{"id":"B","text":"Food that is organic."},{"id":"C","text":"Food they grow."},{"id":"D","text":"Potatoes mostly."}],"id":"cet4-2023-06-1-q4","number":4,"level":"CET4","correctAnswer":"A","hint":"注意报道对食品来源和供应方式的具体说明。","explanation":"A。“Food will all be ready-to-eat space food”对应现成的即食食物。虽然可能种植物，原文特别排除电影中的土豆，不能把部分种植推断为全部自产。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"To prepare for eventually sending astronauts to Mars, NASA began taking applications Friday for four people to live for a year in Mars Dune Alpha. That's a 1,700-square-foot Martian habitat inside a building in Houston. The paid volunteers will work in an environment similar to Mars. They will have limited communications with family, restricted food and resources. NASA is planning three experiments with the first one starting in the fall next year. Food will all be ready-to-eat space food. Some plants will be grown, but not potatoes like in the movie The Martian. \"We want to understand how humans perform in them,\" said lead scientists Grace Douglas.\"We are looking at Mars realistic situations.\" The application process open Friday and they're not seeking just anybody. The requirements are strict, including a master's degree in a science, engineering or math field or pilot experience. Only American citizens or permanent U. S. residents are acceptable. Applicants must be between 30 and 55 and in good physical health. Attitude is key, said former Canadian astronaut Chris Hadfield. He said the participants need to be super competent, resourceful, and not relying on other people to feel comfortable.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What does the news report say about the Japanese mayor Takashi Kawamura?","passage":"","options":[{"id":"A","text":"He apologized for scratching an athlete's gold medal."},{"id":"B","text":"He was asked to present a gold medal to Miu Goto."},{"id":"C","text":"He bit a softball player's Olympic gold medal."},{"id":"D","text":"He attracted public attention at a media event."}],"id":"cet4-2023-06-1-q5","number":5,"level":"CET4","correctAnswer":"C","hint":"关注市长的具体动作，而不是获奖运动员的动作。","explanation":"C。报道开头说市长为“biting the Olympic gold medal of a softball player”道歉，之后叙述他戴上金牌并咬了一口。关键动作是咬金牌，不是颁奖或划伤。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"A Japanese mayor apologized Thursday for biting the Olympic gold medal of a softball player. Nagoya mayor Takashi Kawamura had praised athlete, Miu Goto, during a public media event. He asked her to put the medal around his neck. Kawamura then bit into it. Biting a medal in front of journalists and photographers has become a common pose for Olympic medalists. However, it is only for the winners themselves, not others. \"I'm really sorry that I hurt the treasure of the gold medalist,\" Kawamura told reporters Thursday. The mayor said the medal was undamaged, though he offered to pay for the cost of a new one. Goto, however, has accepted the International Olympic Committee's offer of a replacement, according to Japanese media reports. The scene broadcast on television prompted thousands of complaints to city hall. Some Olympians said they treat their medals as treasures and that it was disrespectful and unacceptable for Kawamura to bite one. \"I would cry if that happened to me,\" said another athlete, Naohisa Takato.\"I handle my own gold medal so gently that I would not scratch it.”","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What did mayor Takashi Kawamura offer to do?","passage":"","options":[{"id":"A","text":"Have another picture taken with the Olympic medalist."},{"id":"B","text":"Apologize to the International Olympic Committee."},{"id":"C","text":"Get the damaged medal repaired."},{"id":"D","text":"Pay for the cost of a new medal."}],"id":"cet4-2023-06-1-q6","number":6,"level":"CET4","correctAnswer":"D","hint":"留意offered后面表达市长愿意承担的责任。","explanation":"D。市长说金牌没有损坏，但“offered to pay for the cost of a new one”。因此他提出支付新金牌费用；原文没有提议修理、再拍照或向奥委会道歉。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"A Japanese mayor apologized Thursday for biting the Olympic gold medal of a softball player. Nagoya mayor Takashi Kawamura had praised athlete, Miu Goto, during a public media event. He asked her to put the medal around his neck. Kawamura then bit into it. Biting a medal in front of journalists and photographers has become a common pose for Olympic medalists. However, it is only for the winners themselves, not others. \"I'm really sorry that I hurt the treasure of the gold medalist,\" Kawamura told reporters Thursday. The mayor said the medal was undamaged, though he offered to pay for the cost of a new one. Goto, however, has accepted the International Olympic Committee's offer of a replacement, according to Japanese media reports. The scene broadcast on television prompted thousands of complaints to city hall. Some Olympians said they treat their medals as treasures and that it was disrespectful and unacceptable for Kawamura to bite one. \"I would cry if that happened to me,\" said another athlete, Naohisa Takato.\"I handle my own gold medal so gently that I would not scratch it.”","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What did some Olympians say they would do with their medals?","passage":"","options":[{"id":"A","text":"Allow no one to touch them."},{"id":"B","text":"See them as symbols of honor."},{"id":"C","text":"Treat them as treasures."},{"id":"D","text":"Keep them in a safe place."}],"id":"cet4-2023-06-1-q7","number":7,"level":"CET4","correctAnswer":"C","hint":"听清一些奥运选手怎样形容自己对奖牌的态度。","explanation":"C。“they treat their medals as treasures”直接对应选项。后面的轻拿轻放是在说明珍视程度，不能据此推断他们绝不让别人触碰或一定锁在安全处。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"A Japanese mayor apologized Thursday for biting the Olympic gold medal of a softball player. Nagoya mayor Takashi Kawamura had praised athlete, Miu Goto, during a public media event. He asked her to put the medal around his neck. Kawamura then bit into it. Biting a medal in front of journalists and photographers has become a common pose for Olympic medalists. However, it is only for the winners themselves, not others. \"I'm really sorry that I hurt the treasure of the gold medalist,\" Kawamura told reporters Thursday. The mayor said the medal was undamaged, though he offered to pay for the cost of a new one. Goto, however, has accepted the International Olympic Committee's offer of a replacement, according to Japanese media reports. The scene broadcast on television prompted thousands of complaints to city hall. Some Olympians said they treat their medals as treasures and that it was disrespectful and unacceptable for Kawamura to bite one. \"I would cry if that happened to me,\" said another athlete, Naohisa Takato.\"I handle my own gold medal so gently that I would not scratch it.”","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What did the woman do to her computer?","passage":"","options":[{"id":"A","text":"She covered its screen with a plastic sheet."},{"id":"B","text":"She connected it with her smartphone."},{"id":"C","text":"She decorated it with colorful stickers."},{"id":"D","text":"She bought some new software for it."}],"id":"cet4-2023-06-1-q8","number":8,"level":"CET4","correctAnswer":"A","hint":"注意女方对电脑屏幕上橙色物体的解释。","explanation":"A。女方说买了能阻挡蓝光的plastic sheet，并且手机上也用这种覆盖物，因此电脑屏幕被塑料片覆盖。其他选项的软件、装饰贴纸或手机连接没有出现。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"M: What's that orange thing on your computer screen? W: It's something I bought yesterday. It's a plastic sheet that blocks blue light. I have one that I use to cover my phone screen too. M: What do you mean by blue light? W: Blue light includes natural light, but it also includes light that isn't natural, for example, from computers, phones, televisions and other electronic devices. M: So blue light is harmful and that's why you want to block it. W: It isn't that simple. Blue light isn't necessarily bad for us. In fact, we need blue light during the day to be healthy. But too much blue light, especially from electronic devices, can harm our health by weakening our vision and making it harder for us to fall asleep. And poor sleep can cause all sorts of health problems. M: I'm not so sure that sleep is nearly as important as people always say it is. I haven't slept enough in months because I have too much work to do, and I feel fine. And it's the same for most of my friends. Poor sleep might be a problem for older people, but surely young people can handle late nights. W: Well,the research I've read shows that sleep is probably even more important than we thought, and that not having enough sleep can contribute to serious health problems like obesity and heart disease. And all the artificial blue light from electronic devices means we have to try harder to sleep well. M: Maybe you're right. I'm on my computer very late most nights, and that's probably why I don't sleep enough.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What does the woman say about blue light?","passage":"","options":[{"id":"A","text":"It may not be simply blue."},{"id":"B","text":"It includes unnatural light."},{"id":"C","text":"It is more harmful to young people."},{"id":"D","text":"It induces people to fall asleep."}],"id":"cet4-2023-06-1-q9","number":9,"level":"CET4","correctAnswer":"B","hint":"留意女方用but补充蓝光来源的部分。","explanation":"B。她说蓝光包括自然光，“but it also includes light that isn't natural”，随后列举电子设备。不能把蓝光一概等同于伤害或认为它能帮助入睡。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"M: What's that orange thing on your computer screen? W: It's something I bought yesterday. It's a plastic sheet that blocks blue light. I have one that I use to cover my phone screen too. M: What do you mean by blue light? W: Blue light includes natural light, but it also includes light that isn't natural, for example, from computers, phones, televisions and other electronic devices. M: So blue light is harmful and that's why you want to block it. W: It isn't that simple. Blue light isn't necessarily bad for us. In fact, we need blue light during the day to be healthy. But too much blue light, especially from electronic devices, can harm our health by weakening our vision and making it harder for us to fall asleep. And poor sleep can cause all sorts of health problems. M: I'm not so sure that sleep is nearly as important as people always say it is. I haven't slept enough in months because I have too much work to do, and I feel fine. And it's the same for most of my friends. Poor sleep might be a problem for older people, but surely young people can handle late nights. W: Well,the research I've read shows that sleep is probably even more important than we thought, and that not having enough sleep can contribute to serious health problems like obesity and heart disease. And all the artificial blue light from electronic devices means we have to try harder to sleep well. M: Maybe you're right. I'm on my computer very late most nights, and that's probably why I don't sleep enough.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"Why does the man say he hasn't slept enough for months?","passage":"","options":[{"id":"A","text":"He has had much trouble falling asleep."},{"id":"B","text":"He has had some sort of health problems."},{"id":"C","text":"He has stayed up playing computer games."},{"id":"D","text":"He has been burdened with excessive work."}],"id":"cet4-2023-06-1-q10","number":10,"level":"CET4","correctAnswer":"D","hint":"区分男方自己描述的原因与女方给出的健康解释。","explanation":"D。男方承认几个月睡眠不足“because I have too much work to do”。他当时自认为状态良好，因此本题问他的原因应选工作过多，不是游戏或已患疾病。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"M: What's that orange thing on your computer screen? W: It's something I bought yesterday. It's a plastic sheet that blocks blue light. I have one that I use to cover my phone screen too. M: What do you mean by blue light? W: Blue light includes natural light, but it also includes light that isn't natural, for example, from computers, phones, televisions and other electronic devices. M: So blue light is harmful and that's why you want to block it. W: It isn't that simple. Blue light isn't necessarily bad for us. In fact, we need blue light during the day to be healthy. But too much blue light, especially from electronic devices, can harm our health by weakening our vision and making it harder for us to fall asleep. And poor sleep can cause all sorts of health problems. M: I'm not so sure that sleep is nearly as important as people always say it is. I haven't slept enough in months because I have too much work to do, and I feel fine. And it's the same for most of my friends. Poor sleep might be a problem for older people, but surely young people can handle late nights. W: Well,the research I've read shows that sleep is probably even more important than we thought, and that not having enough sleep can contribute to serious health problems like obesity and heart disease. And all the artificial blue light from electronic devices means we have to try harder to sleep well. M: Maybe you're right. I'm on my computer very late most nights, and that's probably why I don't sleep enough.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What has the woman learned from the research she has read?","passage":"","options":[{"id":"A","text":"Exposure to blue light is the chief cause of obesity."},{"id":"B","text":"Sleep may be more important than people assumed."},{"id":"C","text":"Sleep may also be negatively affected by natural light."},{"id":"D","text":"Overuse of electronic devices may cause heart disease."}],"id":"cet4-2023-06-1-q11","number":11,"level":"CET4","correctAnswer":"B","hint":"听清研究结果如何修正人们原先对睡眠重要性的认识。","explanation":"B。女方说“sleep is probably even more important than we thought”，对应睡眠比原先认为的更重要。肥胖和心脏病是睡眠不足的潜在后果，并非蓝光单独被认定为首要原因。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"M: What's that orange thing on your computer screen? W: It's something I bought yesterday. It's a plastic sheet that blocks blue light. I have one that I use to cover my phone screen too. M: What do you mean by blue light? W: Blue light includes natural light, but it also includes light that isn't natural, for example, from computers, phones, televisions and other electronic devices. M: So blue light is harmful and that's why you want to block it. W: It isn't that simple. Blue light isn't necessarily bad for us. In fact, we need blue light during the day to be healthy. But too much blue light, especially from electronic devices, can harm our health by weakening our vision and making it harder for us to fall asleep. And poor sleep can cause all sorts of health problems. M: I'm not so sure that sleep is nearly as important as people always say it is. I haven't slept enough in months because I have too much work to do, and I feel fine. And it's the same for most of my friends. Poor sleep might be a problem for older people, but surely young people can handle late nights. W: Well,the research I've read shows that sleep is probably even more important than we thought, and that not having enough sleep can contribute to serious health problems like obesity and heart disease. And all the artificial blue light from electronic devices means we have to try harder to sleep well. M: Maybe you're right. I'm on my computer very late most nights, and that's probably why I don't sleep enough.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What question were both speakers fed up with when they were kids?","passage":"","options":[{"id":"A","text":"What they wanted to be when grown up."},{"id":"B","text":"What their favorite cartoon character was."},{"id":"C","text":"What they learned from computer games."},{"id":"D","text":"What they liked to do most after school."}],"id":"cet4-2023-06-1-q12","number":12,"level":"CET4","correctAnswer":"A","hint":"注意双方都表示厌烦的那个童年问题。","explanation":"A。男方讨厌成人问“What I wanted to be when I grew up”，女方立即表示同感。问题是长大后的职业，而不是喜爱的卡通、游戏或课后活动。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"W: As a kid, did you know what job you wanted to do when you grew up? M: No, I didn't. And I got sick every time adults asked me what I wanted to be when I grew up. W: It's the same with me. And I'm tired of people asking that question of my 10-year-old daughter. My daughter's stock answers are basketball player, pop singer, mechanical engineer. Adults love that last one, as it's the perfect mix of the sensible and the ambitious. When she was much younger,my daughter used to say she wanted to be Queen of the Clouds, which I loved. That's the kind of goal-setting I like to see in children, springing from their boundless imaginations. M: Yes, we grown-ups can be tedious and limiting in our need for reality. And we teach a very gloomy image of adulthood—that whatever our children's future holds, it must be seen within the context of a job. W: How utterly overwhelming and dull! M: When people ask my son what he wants to be when he grows up, I have to swallow the urge to say,\"Hey, back off my kid's dreams!\" W: We can't dismiss the idea that teenagers have to plan to do something after they finish school, and parents are entitled to hope it's more than simply spending 10 hours a day playing computer games. M: But asking\"What do you want to be?\" isn't going to lead a child to a fulfilled life rather lead to false expectations and a high chance of disappointment. W: Exactly. We should be helping our kids understand who they are, even if that means letting go of who we think they should be.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What occupation do adults see as both sensible and ambitious according to the woman?","passage":"","options":[{"id":"A","text":"A stock broker."},{"id":"B","text":"A pop singer."},{"id":"C","text":"A mechanical engineer."},{"id":"D","text":"A basketball player."}],"id":"cet4-2023-06-1-q13","number":13,"level":"CET4","correctAnswer":"C","hint":"留意女儿三个回答中成年人特别喜欢的最后一个。","explanation":"C。女儿说篮球运动员、流行歌手和机械工程师；女方随后说“Adults love that last one”，last one指机械工程师，被认为兼有务实与雄心。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"W: As a kid, did you know what job you wanted to do when you grew up? M: No, I didn't. And I got sick every time adults asked me what I wanted to be when I grew up. W: It's the same with me. And I'm tired of people asking that question of my 10-year-old daughter. My daughter's stock answers are basketball player, pop singer, mechanical engineer. Adults love that last one, as it's the perfect mix of the sensible and the ambitious. When she was much younger,my daughter used to say she wanted to be Queen of the Clouds, which I loved. That's the kind of goal-setting I like to see in children, springing from their boundless imaginations. M: Yes, we grown-ups can be tedious and limiting in our need for reality. And we teach a very gloomy image of adulthood—that whatever our children's future holds, it must be seen within the context of a job. W: How utterly overwhelming and dull! M: When people ask my son what he wants to be when he grows up, I have to swallow the urge to say,\"Hey, back off my kid's dreams!\" W: We can't dismiss the idea that teenagers have to plan to do something after they finish school, and parents are entitled to hope it's more than simply spending 10 hours a day playing computer games. M: But asking\"What do you want to be?\" isn't going to lead a child to a fulfilled life rather lead to false expectations and a high chance of disappointment. W: Exactly. We should be helping our kids understand who they are, even if that means letting go of who we think they should be.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What kind of goal-setting does the woman like to see in children?","passage":"","options":[{"id":"A","text":"Ambitious"},{"id":"B","text":"Sensible."},{"id":"C","text":"Imaginative."},{"id":"D","text":"Practical."}],"id":"cet4-2023-06-1-q14","number":14,"level":"CET4","correctAnswer":"C","hint":"将女方赞赏的目标与她强调的想象力联系起来。","explanation":"C。她喜欢女儿想当“Queen of the Clouds”，并解释这种目标来自“boundless imaginations”。因此欣赏富于想象的目标设定，不是只强调现实或实用。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"W: As a kid, did you know what job you wanted to do when you grew up? M: No, I didn't. And I got sick every time adults asked me what I wanted to be when I grew up. W: It's the same with me. And I'm tired of people asking that question of my 10-year-old daughter. My daughter's stock answers are basketball player, pop singer, mechanical engineer. Adults love that last one, as it's the perfect mix of the sensible and the ambitious. When she was much younger,my daughter used to say she wanted to be Queen of the Clouds, which I loved. That's the kind of goal-setting I like to see in children, springing from their boundless imaginations. M: Yes, we grown-ups can be tedious and limiting in our need for reality. And we teach a very gloomy image of adulthood—that whatever our children's future holds, it must be seen within the context of a job. W: How utterly overwhelming and dull! M: When people ask my son what he wants to be when he grows up, I have to swallow the urge to say,\"Hey, back off my kid's dreams!\" W: We can't dismiss the idea that teenagers have to plan to do something after they finish school, and parents are entitled to hope it's more than simply spending 10 hours a day playing computer games. M: But asking\"What do you want to be?\" isn't going to lead a child to a fulfilled life rather lead to false expectations and a high chance of disappointment. W: Exactly. We should be helping our kids understand who they are, even if that means letting go of who we think they should be.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What does the woman suggest adults should do?","passage":"","options":[{"id":"A","text":"Relax their strict control of their kids."},{"id":"B","text":"Help their kids understand themselves."},{"id":"C","text":"Impose their own dreams on their kids."},{"id":"D","text":"Dismiss their high expectations of their kids."}],"id":"cet4-2023-06-1-q15","number":15,"level":"CET4","correctAnswer":"B","hint":"关注对话末尾对父母帮助孩子方式的总结。","explanation":"B。女方说应“helping our kids understand who they are”，即帮助孩子认识自己，即使要放下父母预设的身份。不是要求孩子实现父母指定的职业梦想。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"W: As a kid, did you know what job you wanted to do when you grew up? M: No, I didn't. And I got sick every time adults asked me what I wanted to be when I grew up. W: It's the same with me. And I'm tired of people asking that question of my 10-year-old daughter. My daughter's stock answers are basketball player, pop singer, mechanical engineer. Adults love that last one, as it's the perfect mix of the sensible and the ambitious. When she was much younger,my daughter used to say she wanted to be Queen of the Clouds, which I loved. That's the kind of goal-setting I like to see in children, springing from their boundless imaginations. M: Yes, we grown-ups can be tedious and limiting in our need for reality. And we teach a very gloomy image of adulthood—that whatever our children's future holds, it must be seen within the context of a job. W: How utterly overwhelming and dull! M: When people ask my son what he wants to be when he grows up, I have to swallow the urge to say,\"Hey, back off my kid's dreams!\" W: We can't dismiss the idea that teenagers have to plan to do something after they finish school, and parents are entitled to hope it's more than simply spending 10 hours a day playing computer games. M: But asking\"What do you want to be?\" isn't going to lead a child to a fulfilled life rather lead to false expectations and a high chance of disappointment. W: Exactly. We should be helping our kids understand who they are, even if that means letting go of who we think they should be.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What are a number of phone companies trying to do in Africa?","passage":"","options":[{"id":"A","text":"Set up company branches."},{"id":"B","text":"Improve its infrastructure."},{"id":"C","text":"Introduce iPhones into its markets."},{"id":"D","text":"Promote Internet-ready phones."}],"id":"cet4-2023-06-1-q16","number":16,"level":"CET4","correctAnswer":"D","hint":"注意文章介绍进入非洲市场的手机具有什么基本能力。","explanation":"D。电话公司正引入“Internet-ready phones”，且出售价格低至20美元的智能机，因此是在推广能联网的手机。价格是扩大可及性的手段，不是全面铺设网络的声明。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"Greater Internet access correlates directly with improved health care, education and economic development. People living in rural areas, however, lag behind in online use, which limits their access to government services, banking and job opportunities. Nowhere is this challenge clearer than in Africa. Most Africans live in rural areas that are tough to wire for Internet access. Now,some phone companies are trying to introduce Internet-ready phones into African markets. Certain companies have started selling simple smartphones for only $20. Previously, the lowest price had been around $40, well out of reach for many people. These devices are powered by software from the giant electronics company, KaiOS Technologies Limited. Most companies are trying to make phones ever more powerful and capable. But KaiOS went the other way. It made every effort to keep the essential capabilities of smartphones, but strip out costs and preserve battery life for people who likely have inadequate access to electricity: The KaiOS devices offer an alternative to the more expensive models that remain out of reach of many Africans and contribute to the digital divide. The body of KaiOS phones is as basic as it gets. Instead of a touchscreen, they're controlled with an old-school keypad. They're designed for 3G networks because 4G coverage doesn't reach two thirds of Africa's customers. In total, KaiOS phones are made from about $15 worth of parts, while Apple's top-of-the-line iPhone has $390 worth of stuff.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"How do KaiOS smartphones differ from smartphones of most other companies?","passage":"","options":[{"id":"A","text":"They cater to Africans' needs."},{"id":"B","text":"They are more expensive models."},{"id":"C","text":"They are more powerful and capable."},{"id":"D","text":"They boast the longest battery life."}],"id":"cet4-2023-06-1-q17","number":17,"level":"CET4","correctAnswer":"A","hint":"对比多数公司的追求与KaiOS相反的设计方向。","explanation":"A。多数公司追求更强性能，KaiOS却保留基本能力、削减成本并延长电池寿命。其设计针对负担能力和供电不足，因此满足非洲用户的实际需求。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"Greater Internet access correlates directly with improved health care, education and economic development. People living in rural areas, however, lag behind in online use, which limits their access to government services, banking and job opportunities. Nowhere is this challenge clearer than in Africa. Most Africans live in rural areas that are tough to wire for Internet access. Now,some phone companies are trying to introduce Internet-ready phones into African markets. Certain companies have started selling simple smartphones for only $20. Previously, the lowest price had been around $40, well out of reach for many people. These devices are powered by software from the giant electronics company, KaiOS Technologies Limited. Most companies are trying to make phones ever more powerful and capable. But KaiOS went the other way. It made every effort to keep the essential capabilities of smartphones, but strip out costs and preserve battery life for people who likely have inadequate access to electricity: The KaiOS devices offer an alternative to the more expensive models that remain out of reach of many Africans and contribute to the digital divide. The body of KaiOS phones is as basic as it gets. Instead of a touchscreen, they're controlled with an old-school keypad. They're designed for 3G networks because 4G coverage doesn't reach two thirds of Africa's customers. In total, KaiOS phones are made from about $15 worth of parts, while Apple's top-of-the-line iPhone has $390 worth of stuff.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What are KaiOS smartphones equipped with?","passage":"","options":[{"id":"A","text":"A large touchscreen."},{"id":"B","text":"An old-school keypad."},{"id":"C","text":"A voice-response device."},{"id":"D","text":"A digitally-designed system."}],"id":"cet4-2023-06-1-q18","number":18,"level":"CET4","correctAnswer":"B","hint":"听清instead of所连接的两种手机操作方式。","explanation":"B。原文说“Instead of a touchscreen, they're controlled with an old-school keypad”。因此配备传统按键；触屏恰好是被替代的方式，不能混淆。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"Greater Internet access correlates directly with improved health care, education and economic development. People living in rural areas, however, lag behind in online use, which limits their access to government services, banking and job opportunities. Nowhere is this challenge clearer than in Africa. Most Africans live in rural areas that are tough to wire for Internet access. Now,some phone companies are trying to introduce Internet-ready phones into African markets. Certain companies have started selling simple smartphones for only $20. Previously, the lowest price had been around $40, well out of reach for many people. These devices are powered by software from the giant electronics company, KaiOS Technologies Limited. Most companies are trying to make phones ever more powerful and capable. But KaiOS went the other way. It made every effort to keep the essential capabilities of smartphones, but strip out costs and preserve battery life for people who likely have inadequate access to electricity: The KaiOS devices offer an alternative to the more expensive models that remain out of reach of many Africans and contribute to the digital divide. The body of KaiOS phones is as basic as it gets. Instead of a touchscreen, they're controlled with an old-school keypad. They're designed for 3G networks because 4G coverage doesn't reach two thirds of Africa's customers. In total, KaiOS phones are made from about $15 worth of parts, while Apple's top-of-the-line iPhone has $390 worth of stuff.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What is said about using recycled plastic to make plastic products in the past?","passage":"","options":[{"id":"A","text":"It ensured sustainable economic growth."},{"id":"B","text":"It was strongly opposed by manufacturers."},{"id":"C","text":"It was cheaper than using fossil fuel plastic."},{"id":"D","text":"It satisfied consumer demands on the whole."}],"id":"cet4-2023-06-1-q19","number":19,"level":"CET4","correctAnswer":"C","hint":"留意for years引出的过去情况，不要与当前价格相混淆。","explanation":"C。开头说过去回收塑料制品“was cheap”，而化石燃料塑料更贵，既环保也经济。后文现在回收塑料贵72美元是在描述变化，不能代替过去情况。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"For years,using recycled plastic to make plastic products was cheap. By contrast, fossil fuel plastic was more expensive. Thus this sustainable option was an economic option too. But now it is cheaper for major manufacturers to use new plastic. According to one recent business report, recycled plastic now costs an extra $72 a tonne compared with newly-made plastic. This may be because of consumer demands. They are pushing for more recycled plastics in new products. Meanwhile, new plastic is becoming cheaper. This is because of a boom in petroleum chemical production from the U. S. The price increase of recycled plastic could cost sustainable manufacturers an extra $250 million a year. Smaller manufacturers may also be forced to use new plastic to reduce costs. Makers of clear plastic bottles may also opt for new fossil-fuel based plastic to save money. Plastic packaging makers are being pressured to use more recycled plastic. This is done in hopes of reducing the enormous amount of plastic pollution in the oceans. The UK government plans to tax companies which don't use at least 30% recycled plastic in their products. Additionally, the government is planning to increase the quantity of recycled plastic in the market. This could mean incentives for new recycling plants. Additionally, recycling facilities may be improved at a local council level and recycled plastic could be imported. This would help increase the amount of recycled plastic in circulation.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What has led to more competitive prices for new plastic?","passage":"","options":[{"id":"A","text":"The capacity to mass produce it."},{"id":"B","text":"The U.S.federal government's regulations."},{"id":"C","text":"A boom in market demand for clear plastic bottles."},{"id":"D","text":"A rapid increase in U.S.petroleum chemical production."}],"id":"cet4-2023-06-1-q20","number":20,"level":"CET4","correctAnswer":"D","hint":"注意解释新塑料价格下降时出现的because。","explanation":"D。原文把新塑料更便宜归因于美国“a boom in petroleum chemical production”，即石油化工生产繁荣。没有说回收设施进步或大规模制造能力才是本题原因。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"For years,using recycled plastic to make plastic products was cheap. By contrast, fossil fuel plastic was more expensive. Thus this sustainable option was an economic option too. But now it is cheaper for major manufacturers to use new plastic. According to one recent business report, recycled plastic now costs an extra $72 a tonne compared with newly-made plastic. This may be because of consumer demands. They are pushing for more recycled plastics in new products. Meanwhile, new plastic is becoming cheaper. This is because of a boom in petroleum chemical production from the U. S. The price increase of recycled plastic could cost sustainable manufacturers an extra $250 million a year. Smaller manufacturers may also be forced to use new plastic to reduce costs. Makers of clear plastic bottles may also opt for new fossil-fuel based plastic to save money. Plastic packaging makers are being pressured to use more recycled plastic. This is done in hopes of reducing the enormous amount of plastic pollution in the oceans. The UK government plans to tax companies which don't use at least 30% recycled plastic in their products. Additionally, the government is planning to increase the quantity of recycled plastic in the market. This could mean incentives for new recycling plants. Additionally, recycling facilities may be improved at a local council level and recycled plastic could be imported. This would help increase the amount of recycled plastic in circulation.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What does the UK government plan to do about plastic?","passage":"","options":[{"id":"A","text":"Require companies to use 30%of new plastic."},{"id":"B","text":"Increase the supply of new plastic in the market."},{"id":"C","text":"Reduce the amount of plastic pollution in local areas."},{"id":"D","text":"Take measures to promote the use of recycled plastic."}],"id":"cet4-2023-06-1-q21","number":21,"level":"CET4","correctAnswer":"D","hint":"把征税门槛与扩大回收塑料供应的措施合起来判断。","explanation":"D。英国计划向回收材料占比不足30%的企业征税，还拟增加回收塑料供给。两类措施共同鼓励企业更多使用回收塑料，不能只看成提高新塑料产量。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"For years,using recycled plastic to make plastic products was cheap. By contrast, fossil fuel plastic was more expensive. Thus this sustainable option was an economic option too. But now it is cheaper for major manufacturers to use new plastic. According to one recent business report, recycled plastic now costs an extra $72 a tonne compared with newly-made plastic. This may be because of consumer demands. They are pushing for more recycled plastics in new products. Meanwhile, new plastic is becoming cheaper. This is because of a boom in petroleum chemical production from the U. S. The price increase of recycled plastic could cost sustainable manufacturers an extra $250 million a year. Smaller manufacturers may also be forced to use new plastic to reduce costs. Makers of clear plastic bottles may also opt for new fossil-fuel based plastic to save money. Plastic packaging makers are being pressured to use more recycled plastic. This is done in hopes of reducing the enormous amount of plastic pollution in the oceans. The UK government plans to tax companies which don't use at least 30% recycled plastic in their products. Additionally, the government is planning to increase the quantity of recycled plastic in the market. This could mean incentives for new recycling plants. Additionally, recycling facilities may be improved at a local council level and recycled plastic could be imported. This would help increase the amount of recycled plastic in circulation.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What do we learn about the Dreamery, a business in Manhattan?","passage":"","options":[{"id":"A","text":"It studies dreams."},{"id":"B","text":"It rents a place for nap-takers."},{"id":"C","text":"It is a hotel for business people."},{"id":"D","text":"It is a nap research institute."}],"id":"cet4-2023-06-1-q22","number":22,"level":"CET4","correctAnswer":"B","hint":"注意Dreamery所出售的服务及其收费方式。","explanation":"B。Dreamery以25美元出售安静暗室中45分钟的小憩，“This is a nap joint”，不是旅馆。收费休息服务是报道对这家企业的核心介绍。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"At the Dreamery, a business in Manhattan, naps are for sale. A 45-minute session in a darkened enclosure with peace and quiet costs $25. To be clear, this institution is no hotel. This is a nap joint. It sells the idea of the nap as much as the nap itself. Is a nap worth $25? The answer is obviously yes. Here, at this point in the argument, it's traditional for me to bring up all the studies that show the benefits of napping. But do you really need experts to tell you that? Just look at the world around you at 2:30 in the afternoon. I've been working from home for more than 10 years now. And the quality and quantity of work I can do emerges directly from my ability to concentrate. I don't understand how people have creative careers without napping. Every day at about 1 p.m., everyone faces the same choice: sleep until 2 p.m.and then work until 5, or daydream and drift around social media and attend pointless meetings until 7 p.m. The friends I have who still work in offices inform me their bosses insist that they take the second option, and that napping is associated with laziness. I genuinely find it odd. For if you nap properly, it's like waking up from a full night's sleep and you can double your day's worth of concentration.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"Why does the speaker ask us to look at the world around us at 2:30 in the afternoon?","passage":"","options":[{"id":"A","text":"To find out creative people's work performance."},{"id":"B","text":"To see how many people can go without napping."},{"id":"C","text":"To understand the obvious importance of napping."},{"id":"D","text":"To feel how difficult it is to get his idea across."}],"id":"cet4-2023-06-1-q23","number":23,"level":"CET4","correctAnswer":"C","hint":"结合讲话者随后对下午工作状态的描述理解这个反问。","explanation":"C。讲话者反问午睡是否值25美元并给肯定答案，又让人观察下午2:30的状态，以说明午睡的重要性。不是要求去搜集研究或宣传某家店的优惠。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"At the Dreamery, a business in Manhattan, naps are for sale. A 45-minute session in a darkened enclosure with peace and quiet costs $25. To be clear, this institution is no hotel. This is a nap joint. It sells the idea of the nap as much as the nap itself. Is a nap worth $25? The answer is obviously yes. Here, at this point in the argument, it's traditional for me to bring up all the studies that show the benefits of napping. But do you really need experts to tell you that? Just look at the world around you at 2:30 in the afternoon. I've been working from home for more than 10 years now. And the quality and quantity of work I can do emerges directly from my ability to concentrate. I don't understand how people have creative careers without napping. Every day at about 1 p.m., everyone faces the same choice: sleep until 2 p.m.and then work until 5, or daydream and drift around social media and attend pointless meetings until 7 p.m. The friends I have who still work in offices inform me their bosses insist that they take the second option, and that napping is associated with laziness. I genuinely find it odd. For if you nap properly, it's like waking up from a full night's sleep and you can double your day's worth of concentration.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What do we learn about the quantity and quality of the speaker's work?","passage":"","options":[{"id":"A","text":"They decline due to pointless meetings."},{"id":"B","text":"They depend on his ability to concentrate."},{"id":"C","text":"They enable him to enjoy a creative career."},{"id":"D","text":"They are affected by the overuse of social media."}],"id":"cet4-2023-06-1-q24","number":24,"level":"CET4","correctAnswer":"B","hint":"留意工作质量和数量直接取决于哪一种能力。","explanation":"B。讲话者说工作的质量和数量“emerges directly from my ability to concentrate”，因此二者直接受专注能力影响。工作地点和工时只是背景，不是他指出的直接决定因素。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"At the Dreamery, a business in Manhattan, naps are for sale. A 45-minute session in a darkened enclosure with peace and quiet costs $25. To be clear, this institution is no hotel. This is a nap joint. It sells the idea of the nap as much as the nap itself. Is a nap worth $25? The answer is obviously yes. Here, at this point in the argument, it's traditional for me to bring up all the studies that show the benefits of napping. But do you really need experts to tell you that? Just look at the world around you at 2:30 in the afternoon. I've been working from home for more than 10 years now. And the quality and quantity of work I can do emerges directly from my ability to concentrate. I don't understand how people have creative careers without napping. Every day at about 1 p.m., everyone faces the same choice: sleep until 2 p.m.and then work until 5, or daydream and drift around social media and attend pointless meetings until 7 p.m. The friends I have who still work in offices inform me their bosses insist that they take the second option, and that napping is associated with laziness. I genuinely find it odd. For if you nap properly, it's like waking up from a full night's sleep and you can double your day's worth of concentration.","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"listening","section":"listening","prompt":"What does the speaker say he finds odd?","passage":"","options":[{"id":"A","text":"Some bosses associate napping with laziness."},{"id":"B","text":"Many office workers nap during work hours."},{"id":"C","text":"Some bosses can concentrate without napping."},{"id":"D","text":"Many of his friends daydream in the office."}],"id":"cet4-2023-06-1-q25","number":25,"level":"CET4","correctAnswer":"A","hint":"关注最后一段讲话者认为奇怪的办公室观念。","explanation":"A。他的朋友说老板把午睡视为懒惰，讲话者对此觉得奇怪，随后说明合适午睡能加倍一天的专注力。奇怪的是这种负面看法，而不是午睡收费本身。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"At the Dreamery, a business in Manhattan, naps are for sale. A 45-minute session in a darkened enclosure with peace and quiet costs $25. To be clear, this institution is no hotel. This is a nap joint. It sells the idea of the nap as much as the nap itself. Is a nap worth $25? The answer is obviously yes. Here, at this point in the argument, it's traditional for me to bring up all the studies that show the benefits of napping. But do you really need experts to tell you that? Just look at the world around you at 2:30 in the afternoon. I've been working from home for more than 10 years now. And the quality and quantity of work I can do emerges directly from my ability to concentrate. I don't understand how people have creative careers without napping. Every day at about 1 p.m., everyone faces the same choice: sleep until 2 p.m.and then work until 5, or daydream and drift around social media and attend pointless meetings until 7 p.m. The friends I have who still work in offices inform me their bosses insist that they take the second option, and that napping  clothing production.\n\nClean water is [30] ____ becoming one of the most sought-after resources in the world. Given how large the [31] ____ and cotton industries are, they take up a lot of our fresh water demands across the world, according to The Huffington Post. The video from National Geographic was created to spread [32] ____ of how environmentally harmful cotton is. But the situation can be made better. Through better water management and farming practices, water usage in cotton production can be cut down by [33] ____ 40 percent.\n\nCalled “Better Cotton”, this environmentally conscious product will save millions of liters of water a year simply from [34] ____ the demands of cotton production. Cotton doesn't have to go, since it is, after all, one of the most useful cash crops across the globe. However, as water supplies [35] ____, farmers and consumers need to be more conscious of the effect that these products have on the environment as a whole.","options":[{"id":"A","text":"abstracts"},{"id":"B","text":"abundant"},{"id":"C","text":"awareness"},{"id":"D","text":"conscience"},{"id":"E","text":"exact"},{"id":"F","text":"increasingly"},{"id":"G","text":"intense"},{"id":"H","text":"mend"},{"id":"I","text":"nearly"},{"id":"J","text":"reckoning"},{"id":"K","text":"reducing"},{"id":"L","text":"sew"},{"id":"M","text":"shrink"},{"id":"N","text":"statistics"},{"id":"O","text":"textile"}],"id":"cet4-2023-06-1-q35","number":35,"level":"CET4","correctAnswer":"M","hint":"注意as从句需要与water supplies搭配的谓语。","explanation":"M，shrink，缩减。as water supplies shrink表示随着供水减少，农民和消费者更应注意环境影响。空格须有时态谓语，reducing不能单独作此从句的谓语。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_matching","prompt":"According to Francis Dittoh, their speech-based weather information service was meant to be inexpensive and easy to use.","passage":"The spoken web\n\nA) We're growing more used to chatting to our computers, phones and smart speakers through voice assistants like Amazon's Alexa, Apple's Siri and Microsoft's Cortana. Blind and partially sighted people have been using text-to-speech converters for decades.\n\nB) Out of these assistants, Siri is the most well-known. The assistant uses voice inquiries and a natural-language user interface (界面)to answer questions. The software adapts to users' individual language usages, searches, and preferences, with continuing use.\n\nC) Some think voice could soon take over from typing and clicking as the main way to interact online. But what are the challenges of moving to “the spoken web”?\n\nD) What use is written online content if you can't read? That is the situation facing illiterate (不识字的)African farmers. They are often denied crucial information the web offers many others. With a literacy rate in some parts of Africa at only 22.6%, farmers are often “underpaid for their produce because they might be unaware of the prevailing prices,” says Francis Dittoh, a researcher behind Mr Meteo, a speech-based weather information service.\n\nE) “The most frequently heard complaint is about rainfall predictions,” says Mr Dittoh, who lives in Tamale, northern Ghana. “They tell us the methods their forefathers used to predict the weather don't seem to work as well these days. \"This is down to climate change, he believes. Yet knowing when it's going to rain is vital for farmers wanting to sow seeds, irrigate crops or take their animals out to the fields to feed on grass.\n\nF) Mr Dittoh says the idea of converting online weather reports into speech came from the farmers themselves, after a workshop in the village of Guabuligah. \"They came up with this,” he says. Mr Meteo takes the online weather forecast, converts it to a short recording in the appropriate language and makes it available on a basic phone. Farmers ring up to receive the information. The local language Dagbani is spoken by 1. 2 million people but is not served by any online translation applications. The service was designed to be cheap and easy to run, says Mr Dittoh. He plans to begin field tests this month, working with Tamale's Savanna Agricultural Research Institute.\n\nG) The spoken web could also help the one-in-five adults in Europe and the U.S. with poor reading skills. But building the spoken web-web-to-voice and voice-to-web-isn't straightforward. For software to understand pizza is served at Italian restaurants is easy. To cover multiple domains and to be able to have a conversation with users on every single topic is still a long way off.\n\nH) So although many computer assistants can answer simple questions about the weather and play music for us, anything resembling a wide-ranging human conversation is decades away. Artificial intelligence just isn't smart enough yet. Even turning your voice into text — automatic speech recognition — is one of the hardest problems to solve, as there are as many ways to pronounce things as there are people on the planet.\n\nI) Siri has often been praised for its ability to interpret our casual language and deliver very specific and accurate results, sometimes even providing additional information. But it is still somewhat restricted, particularly when the language moves away from stiffer commands into more human interactions. In one example, the phrase “Send a text to Jason, Clint, Sam, and Lee saying we're having dinner at Silver Cloud restaurant” was interpreted as sending a message to Jason only, containing the text “Clint Sam and Lee saying we're having dinner at Silver Cloud restaurant\". It has also been noted that Siri lacks a proper editing function, as saying “Edit message to say: we're at Silver Cloud restaurant and you should come find us\"generates \"Clint Sam and Lee saying we're having dinner at Silver Cloud restaurant to say we're at Silver Cloud restaurant and you should come find us\".\n\nJ) Using voice interaction feels far more intimate than surfing the net the old-fashioned way. This is intentional as the informal tone of the assistant helps create an emotional attachment. But if something speaks, it must also listen. Our phones are always near us and they are collecting data about us all the time. This has already raised privacy concerns. The American Civil Liberties Union has stated that digital assistants create a threat to privacy from hackers. Some people have other concerns. They worry assistants will one day be used to deliver advertising directly to us.\n\nK) But digital voices need more personality to make them popular. Robots are not yet witty, Siri is boring. The benefits of using voice instead of tapping fingers obviously. depend on the context. Doctors completing online forms about their patients by speech, for example, can dictate 150 words a minute, three times faster than typing on a keyboard. This enables them to spend less time on administration and more time with patients.\n\nL) Last year, speech recognition company Nuance helped a doctors' surgery in Dukinfield, near Manchester, set up a speech system for the practice's six doctors. Now they can dictate notes on a patient's health condition and treatment and a smart assistant automatically enters the information into the right fields on a web form. Previously, the doctors made voice recordings that were then transcribed by secretaries — a process that was costly and likely to cause delays. The new system means letters to patients now have more detail.\n\nM) Using voice also makes sense when you're doing other things with your hands. Think about when you're cooking, and you just want to know what the next step in the recipe is. Your hands are covered with oil; you're not going to get on the iPad, so it's a lot more natural to talk. And speech obviously makes sense when you're driving. In the U.S., 29%of drivers admit they surf behind the wheel, according to insurance firm State Farm. This is up from 13% in 2009. No wonder using mobile phones while driving causes more crashes a year than drink driving, says the U.S. National Safety Council.","options":[{"id":"A","text":"A 段"},{"id":"B","text":"B 段"},{"id":"C","text":"C 段"},{"id":"D","text":"D 段"},{"id":"E","text":"E 段"},{"id":"F","text":"F 段"},{"id":"G","text":"G 段"},{"id":"H","text":"H 段"},{"id":"I","text":"I 段"},{"id":"J","text":"J 段"},{"id":"K","text":"K 段"},{"id":"L","text":"L 段"},{"id":"M","text":"M 段"}],"id":"cet4-2023-06-1-q36","number":36,"level":"CET4","correctAnswer":"F","hint":"寻找描述气象语音服务成本和操作难度的词组。","explanation":"F段说“The service was designed to be cheap and easy to run”，与题干inexpensive and easy to use同义。主体是Francis Dittoh的气象服务，而不是一般语音助手的市场价格。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_matching","prompt":"Using voice instead of typing enables doctors to spend more time taking care of patients.","passage":"The spoken web\n\nA) We're growing more used to chatting to our computers, phones and smart speakers through voice assistants like Amazon's Alexa, Apple's Siri and Microsoft's Cortana. Blind and partially sighted people have been using text-to-speech converters for decades.\n\nB) Out of these assistants, Siri is the most well-known. The assistant uses voice inquiries and a natural-language user interface (界面)to answer questions. The software adapts to users' individual language usages, searches, and preferences, with continuing use.\n\nC) Some think voice could soon take over from typing and clicking as the main way to interact online. But what are the challenges of moving to “the spoken web”?\n\nD) What use is written online content if you can't read? That is the situation facing illiterate (不识字的)African farmers. They are often denied crucial information the web offers many others. With a literacy rate in some parts of Africa at only 22.6%, farmers are often “underpaid for their produce because they might be unaware of the prevailing prices,” says Franci hones and smart speakers through voice assistants like Amazon's Alexa, Apple's Siri and Microsoft's Cortana. Blind and partially sighted people have been using text-to-speech converters for decades.\n\nB) Out of these assistants, Siri is the most well-known. The assistant uses voice inquiries and a natural-language user interface (界面)to answer questions. The software adapts to users' individual language usages, searches, and preferences, with continuing use.\n\nC) Some think voice could soon take over from typing and clicking as the main way to interact online. But what are the challenges of moving to “the spoken web”?\n\nD) What use is written online content if you can't read? That is the situation facing illiterate (不识字的)African farmers. They are often denied crucial information the web offers many others. With a literacy rate in some parts of Africa at only 22.6%, farmers are often “underpaid for their produce because they might be unaware of the prevailing prices,” says Francis Dittoh, a researcher behind Mr Meteo, a speech-based weather information service.\n\nE) “The most frequently heard complaint is about rainfall predictions,” says Mr Dittoh, who lives in Tamale, northern Ghana. “They tell us the methods their forefathers used to predict the weather don't seem to work as well these days. \"This is down to climate change, he believes. Yet knowing when it's going to rain is vital for farmers wanting to sow seeds, irrigate crops or take their animals out to the fields to feed on grass.\n\nF) Mr Dittoh says the idea of converting online weather reports into speech came from the farmers themselves, after a workshop in the village of Guabuligah. \"They came up with this,” he says. Mr Meteo takes the online weather forecast, converts it to a short recording in the appropriate language and makes it available on a basic phone. Farmers ring up to receive the information. The local language Dagbani is spoken by 1. 2 million people but is not served by any online translation applications. The service was designed to be cheap and easy to run, says Mr Dittoh. He plans to begin field tests this month, working with Tamale's Savanna Agricultural Research Institute.\n\nG) The spoken web could also help the one-in-five adults in Europe and the U.S. with poor reading skills. But building the spoken web-web-to-voice and voice-to-web-isn't straightforward. For software to understand pizza is served at Italian restaurants is easy. To cover multiple domains and to be able to have a conversation with users on every single topic is still a long way off.\n\nH) So although many computer assistants can answer simple questions about the weather and play music for us, anything resembling a wide-ranging human conversation is decades away. Artificial intelligence just isn't smart enough yet. Even turning your voice into text — automatic speech recognition — is one of the hardest problems to solve, as there are as many ways to pronounce things as there are people on the planet.\n\nI) Siri has often been praised for its ability to interpret our casual language and deliver very specific and accurate results, sometimes even providing additional information. But it is still somewhat restricted, particularly when the language moves away from stiffer commands into more human interactions. In one example, the phrase “Send a text to Jason, Clint, Sam, and Lee saying we're having dinner at Silver Cloud restaurant” was interpreted as sending a message to Jason only, containing the text “Clint Sam and Lee saying we're having dinner at Silver Cloud restaurant\". It has also been noted that Siri lacks a proper editing function, as saying “Edit message to say: we're at Silver Cloud restaurant and you should come find us\"generates \"Clint Sam and Lee saying we're having dinner at Silver Cloud restaurant to say we're at Silver Cloud restaurant and you should come find us\".\n\nJ) Using voice interaction feels far more intimate than surfing the net the old-fashioned ehind Mr Meteo, a speech-based weather information service.\n\nE) “The most frequently heard complaint is about rainfall predictions,” says Mr Dittoh, who lives in Tamale, northern Ghana. “They tell us the methods their forefathers used to predict the weather don't seem to work as well these days. \"This is down to climate change, he believes. Yet knowing when it's going to rain is vital for farmers wanting to sow seeds, irrigate crops or take their animals out to the fields to feed on grass.\n\nF) Mr Dittoh says the idea of converting online weather reports into speech came from the farmers themselves, after a workshop in the village of Guabuligah. \"They came up with this,” he says. Mr Meteo takes the online weather forecast, converts it to a short recording in the appropriate language and makes it available on a basic phone. Farmers ring up to receive the information. The local language Dagbani is spoken by 1. 2 million people but is not served by any online translation applications. The service was designed to be cheap and easy to run, says Mr Dittoh. He plans to begin field tests this month, working with Tamale's Savanna Agricultural Research Institute.\n\nG) The spoken web could also help the one-in-five adults in Europe and the U.S. with poor reading skills. But building the spoken web-web-to-voice and voice-to-web-isn't straightforward. For software to understand pizza is served at Italian restaurants is easy. To cover multiple domains and to be able to have a conversation with users on every single topic is still a long way off.\n\nH) So although many computer assistants can answer simple questions about the weather and play music for us, anything resembling a wide-ranging human conversation is decades away. Artificial intelligence just isn't smart enough yet. Even turning your voice into text — automatic speech recognition — is one of the hardest problems to solve, as there are as many ways to pronounce things as there are people on the planet.\n\nI) Siri r decades.\n\nB) Out of these assistants, Siri is the most well-known. The assistant uses voice inquiries and a natural-language user interface (界面)to answer questions. The software adapts to users' individual language usages, searches, and preferences, with continuing use.\n\nC) Some think voice could soon take over from typing and clicking as the main way to interact online. But what are the challenges of moving to “the spoken web”?\n\nD) What use is written online content if you can't read? That is the situation facing illiterate (不识字的)African farmers. They are often denied crucial information the web offers many others. With a literacy rate in some parts of Africa at only 22.6%, farmers are often “underpaid for their produce because they might be unaware of the prevailing prices,” says Francis Dittoh, a researcher behind Mr Meteo, a speech-based weather information service.\n\nE) “The most frequently heard complaint is about rainfall predictions,” says Mr Dittoh, who lives in Tamale, northern Ghana. “They tell us the methods their forefathers used to predict the weather don't seem to work as well these days. \"This is down to climate change, he believes. Yet knowing when it's going to rain is vital for farmers wanting to sow seeds, irrigate crops or take their animals out to the fields to feed on grass.\n\nF) Mr Dittoh says the idea of converting online weather reports into speech came from the farmers themselves, after a workshop in the village of Guabuligah. \"They came up with this,” he says. Mr Meteo takes the online weather forecast, converts it to a short recording in the appropriate language and makes it available on a basic phone. Farmers ring up to receive the information. The local language Dagbani is spoken by 1. 2 million people but is not served by any online translation applications. The service was designed to be cheap and easy to run, says Mr Dittoh. He plans to begin field tests this month, working with Tamale's Savanna Agricultural Research Institute.\n\nG) The spoken web could also help the one-in-five adults in Europe and the U.S. with poor reading skills. But building the spoken web-web-to-voice and voice-to-web-isn't straightforward. For software to understand pizza is served at Italian restaurants is easy. To cover multiple domains and to be able to have a conversation with users on every single topic is still a long way off.\n\nH) So although many computer assistants can answer simple questions about the weather and play music for us, anything resembling a wide-ranging human conversation is decades away. Artificial intelligence just isn't smart enough yet. Even turning your voice into text — automatic speech recognition — is one of the hardest problems to solve, as there are as many ways to pronounce things as there are people on the planet.\n\nI) Siri has often been praised for its ability to interpret our casual language and deliver very specific and accurate results, sometimes even providing additional information. But it is still somewhat restricted, particularly when the language moves away from stiffer commands into more human interactions. In one example, the phrase “Send a text to Jason, Clint, Sam, and Lee saying we're having dinner at Silver Cloud restaurant” was interpreted as sending a message to Jason only, containing the text “Clint Sam and Lee saying we're having dinner at Silver Cloud restaurant\". It has also been noted that Siri lacks a proper editing function, as saying “Edit message to say: we're at Silver Cloud restaurant and you should come find us\"generates \"Clint Sam and Lee saying we're having dinner at Silver Cloud restaurant to say we're at Silver Cloud restaurant and you should come find us\".\n\nJ) Using voice interaction feels far more intimate than surfing the net the old-fashioned way. This is intentional as the informal tone of the assistant helps create an emotional attachment. But if something speaks, it must also listen. Our phones are always near us and they are collecting data about us all the time. This has already raised privacy concerns. The American Civil Liberties Union has stated that digital assistants create a threat to privacy from hackers. Some people have other concerns. They worry assistants will one day be used to deliver advertising directly to us.\n\nK) But digital voices need more personality to make them popular. Robots are not yet witty, Siri is boring. The benefits of using voice instead of tapping fingers obviously. depend on the context. Doctors completing online forms about their patients by speech, for example, can dictate 150 words a minute, three times faster than typing on a keyboard. This enables them to spend less time on administration and more time with patients.\n\nL) Last year, speech recognition company Nuance helped a doctors' surgery in Dukinfield, near Manchester, set up a speech system for the practice's six doctors. Now they can dictate notes on a patient's health condition and treatment and a smart assistant automatically enters the information into the right fields on a web form. Previously, the doctors made voice recordings that were then transcribed by secretaries — a process that was costly and likely to cause delays. The new system means letters to patients now have more detail.\n\nM) Using voice also makes sense when you're doing other things with your hands. Think about when you're cooking, and you just want to know what the next step in the recipe is. Your hands are covered with oil; you're not going to get on the iPad, so it's a lot more natural to talk. And speech obviously makes sense when you're driving. In the U.S., 29%of drivers admit they surf behind the wheel, according to insurance firm State Farm. This is up from 13% in 2009. No wonder using mobile phones while driving causes more crashes a year than drink driving, says the U.S. National Safety Council.","options":[{"id":"A","text":"A 段"},{"id":"B","text":"B 段"},{"id":"C","text":"C 段"},{"id":"D","text":"D 段"},{"id" d for hard work and diligence, turning housing from a basic necessity into a luxury.\n\nThis is reflected in our homes. The average single-family home built in the United States before 1970 was less than 1,500 square feet in size. By 2016, the average size of a new, single-family home was 2,422 square feet. What's more, homes built in the 2000s were more likely than earlier models to have more of all types of spaces: bedrooms, bathrooms, living rooms, dining rooms, recreation rooms and garages.\n\nThere are consequences of living big. As middle-class houses have grown larger, two things have happened. First, large houses take time to maintain, so cleaners and other low-wage service workers are required to keep these houses in order. Second, once-public spaces, where people from diverse backgrounds used to come together, have increasingly become privatized, leading to a reduction in the number of public facilities available to all, and a reduced quality of life for many. Take swimming pools. While in 1950, only 2,500 U.S. families owned pools, by 1999 this number was 4 million. At the same time, public municipal pools were often closed, leaving low-income people nowhere to swim.\n\nThe trend for bigger housing thus poses ethical questions. Should Americans accept a system in which the middle and upper classes enjoy a luxurious lifestyle, using the low-wage labor of others? Are we willing to accept a system in which an increase in amenities purchased by the affluent means a reduction in amenities for the poor?\n\nI believe neither is acceptable. We must change the way we think: living well does not need to mean having more private spaces; instead, it could mean having more public spaces. A better goal than building bigger houses for some is to create more publicly accessible spaces and amenities for all.","options":[{"id":"A","text":"A luxury for the homeless."},{"id":"B","text":"A reward for industriousness."},{"id":"C","text":"An abundant source of comforts."},{"id":"D","text":"An absolute necessity for happiness."}],"id":"cet4-2023-06-1-q46","number":46,"level":"CET4","correctAnswer":"B","hint":"找首段广告如何把大房子与勤奋工作联系起来。","explanation":"B。首段“a reward for hard work and diligence”直接对应a reward for industriousness。作者在描述营销说法，不是在主张无家可归者应获得奢侈品或所有幸福都依赖豪宅。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What is one of the consequences of living big?","passage":"The United States is facing a housing crisis: Affordable housing is inadequate, while luxury homes abound (充裕), and homelessness remains a persistent problem. Despite this, popular culture and the housing industry market happiness as living with both more space and more amenities (便利设施). Big houses are adverted as a reward for hard work and diligence, turning housing from a basic necessity into a luxury.\n\nThis is reflected in our homes. The average single-family home built in the United States before 1970 was less than 1,500 square feet in size. By 2016, the average size of a new, single-family home was 2,422 square feet. What's more, homes built in the 2000s were more likely than earlier models to have more of all types of spaces: bedrooms, bathrooms, living rooms, dining rooms, recreation rooms and garages.\n\nThere are consequences of living big. As middle-class houses have grown larger, two things have happened. First, large houses take time to maintain, so cleaners and other low-wage service workers are required to keep these houses in order. Second, once-public spaces, where people from diverse backgrounds used to come together, have increasingly become privatized, leading to a reduction in the number of public facilities available to all, and a reduced quality of life for many. Take swimming pools. While in 1950, only 2,500 U.S. families owned pools, by 1999 this number was 4 million. At the same time, public municipal pools were often closed, lea

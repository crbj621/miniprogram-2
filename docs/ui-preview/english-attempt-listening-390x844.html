e average size of a new, single-family home was 2,422 square feet. What's more, homes built in the 2000s were more likely than earlier models to have more of all types of spaces: bedrooms, bathrooms, living rooms, dining rooms, recreation rooms and garages.\n\nThere are consequences of living big. As middle-class houses have grown larger, two things have happened. First, large houses take time to maintain, so cleaners and other low-wage service workers are required to keep these houses in order. Second, once-public spaces, where people from diverse backgrounds used to come together, have increasingly become privatized, leading to a reduction in the number of public facilities available to all, and a reduced quality of life for many. Take swimming pools. While in 1950, only 2,500 U.S. families owned pools, by 1999 this number was 4 million. At the same time, public municipal pools were often closed, leaving low-income people nowhere to swim.\n\nThe trend for bigger housing thus poses ethical questions. Should Americans accept a system in which the middle and upper classes enjoy a luxurious lifestyle, using the low-wage labor of others? Are we willing to accept a system in which an increase in amenities purchased by the affluent means a reduction in amenities for the poor?\n\nI believe neither is acceptable. We must change the way we think: living well does not need to mean having more private spaces; instead, it could mean having more public spaces. A better goal than building bigger houses for some is to create more publicly accessible spaces and amenities for all.","options":[{"id":"A","text":"Questions related to moral principles."},{"id":"B","text":"Questions having to do with labor cost."},{"id":"C","text":"Questions about what lifestyle to promote."},{"id":"D","text":"Questions concerning housing development."}],"id":"cet4-2023-06-1-q48","number":48,"level":"CET4","correctAnswer":"A","hint":"理解ethical questions所指的问题类型。","explanation":"A。第四段直接说大住房趋势“poses ethical questions”，随后问富人享受是否依赖低薪劳工和穷人设施减少。因此是道德原则问题，不只是计算劳动成本或推广生活方式。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What kind of social system does the author think is unacceptable?","passage":"The United States is facing a housing crisis: Affordable housing is inadequate, while luxury homes abound (充裕), and homelessness remains a persistent problem. Despite this, popular culture and the housing industry market happiness as living with both more space and more amenities (便利设施). Big houses are adverted as a reward for hard work and diligence, turning housing from a basic necessity into a luxury.\n\nThis is reflected in our homes. The average single-family home built in the United States before 1970 was less than 1,500 square feet in size. By 2016, the average size of a new, single-family home was 2,422 square feet. What's more, homes built in the 2000s were more likely than earlier models to have more of all types of spaces: bedrooms, bathrooms, living rooms, dining rooms, recreation rooms and garages.\n\nThere are consequences of living big. As middle-class houses have grown larger, two things have happened. First, large houses take time to maintain, so cleaners and other low-wage service workers are required to keep these houses in order. Second, once-public spaces, where people from diverse backgrounds used to come together, have increasingly become privatized, leading to a reduction in the number of public facilities available to all, and a reduced quality of life for many. Take swimming pools. While in 1950, only 2,500 U.S. families owned pools, by 1999 this number was 4 million. At the same time, public municipal pools were often closed, leaving low-income people nowhere to swim.\n\nThe trend for bigger housing thus poses ethical questions. Should Americans accept a system in which the middle and upper classes enjoy a luxurious lifestyle, using the low-wage labor of others? Are we willing to accept a system in which an increase in amenities purchased by the affluent means a reduction in amenities for the poor?\n\nI believe neither is acceptable. We must change the way we think: living well does not need to mean having more private spaces; instead, it could mean having more public spaces. A better goal than building bigger houses for some is to create more publicly accessible spaces and amenities for all.","options":[{"id":"A","text":"One in which the wealthy exploit the low-wage laborers building their houses."},{"id":"B","text":"One in which the rich purchase amenities at an increasingly unjustifiable price."},{"id":"C","text":"One in which the upper classes deprive the lower classes of affordable housing."},{"id":"D","text":"One in which the affluent enjoy a more comfortable life at the expense of the poor."}],"id":"cet4-2023-06-1-q49","number":49,"level":"CET4","correctAnswer":"D","hint":"结合第四段两个问句与第五段的否定理解作者立场。","explanation":"D。作者不接受富人的设施增加意味着穷人的设施减少的制度；D概括为富人舒适生活以穷人的损失为代价。B只讲价格、C只讲住房，均缩窄或改变了文章讨论的制度问题。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author advocate for people to live well?","passage":"The United States is facing a housing crisis: Affordable housing is inadequate, while luxury homes abound (充裕), and homelessness remains a persistent problem. Despite this, popular culture and the housing industry market happiness as living with both more space and more amenities (便利设施). Big houses are adverted as a reward for hard work and diligence, turning housing from a basic necessity into a luxury.\n\nThis is reflected in our homes. The average single-family home built in the United States before 1970 was less than 1,500 square feet in size. By 2016, the average size of a new, single-family home was 2,422 square feet. What's more, homes built in the 2000s were more likely than earlier models to have more of all types of spaces: bedrooms, bathrooms, living rooms, dining rooms, recreation rooms and garages.\n\nThere are consequences of living big. As middle-class houses have grown larger, two things have happened. First, large houses take time to maintain, so cleaners and other low-wage service workers are required to keep these houses in order. Second, once-public spaces, where people from diverse backgrounds used to come together, have increasingly become privatized, leading to a reduction in the number of public facilities available to all, and a reduced quality of life for many. Take swimming pools. While in 1950, only 2,500 U.S. families owned pools, by 1999 this number was 4 million. At the same time, public municipal pools were often closed, leaving low-income people nowhere to swim.\n\nThe trend for bigger housing thus poses ethical questions. Should Americans accept a system in which the middle and upper classes enjoy a luxurious lifestyle, using the low-wage labor of others? Are we willing to accept a system in which an increase in amenities purchased by the affluent means a reduction in amenities for the poor?\n\nI believe neither is acceptable. We must change the way we think: living well does not need to mean having more private spaces; instead, it could mean having more public spaces. A better goal than building bigger houses for some is to create more publicly accessible spaces and amenities for all.","options":[{"id":"A","text":"Finding ways to turn private spaces into public ones."},{"id":"B","text":"Building more houses affordable to those less affluent."},{"id":"C","text":"More public spaces created for everyone to enjoy."},{"id":"D","text":"All amenities made accessible to the rich and the poor alike."}],"id":"cet4-2023-06-1-q50","number":50,"level":"CET4","correctAnswer":"C","hint":"区分作者主张增加公共空间与把所有私产一律共享。","explanation":"C。末段提出“create more publicly accessible spaces and amenities for all”，即创造更多公共空间供所有人享受。文章没有要求把全部私有空间或全部设施转为公共所有。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author think of most entrepreneurs?","passage":"Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and spend more effort to get them.\n\nOverall, this is a positive quality, especially for people trying to build their own businesses. Apparently, if you're more naturally driven to set goals, you are more likely to succeed\n\nActually, this isn't always the case. In fact, in some cases, extreme ambition may end up doing more harm than good.\n\nOne major side effect of excessive ambition is the tendency to focus too determinedly on one particular vision or end goal. This is problematic because it hinders your ability to adapt to new circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to threaten your business, you may need to change direction, even if that means straying from your original vision. If you have too much ambition, you'll find this hard, if not impossible.\n\nFew people are successful when they try to build their first brand. Unfortunately, for the most ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n\nIt's a clear departure from the intended plan toward the intended goal. For people with limited ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and every failure you survive is a learning experience.\n\nAmbitious people tend to be more materialistically successful than their non-ambitious counterparts. However, they're only slightly happier than their less-ambitious counterparts, and tend to live significantly shorter lives. This implies that even though ambitious people are more likely to achieve conventional “success,” such success means nothing for their health and happiness — and if you don't have health and happiness, what else could possibly matter?\n\nClearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn't start your own business, set or achieve goals and get far in life. But an excess of ambition can also be dangerous, putting you at risk of burnout, stubbornness and even a shorter life.","options":[{"id":"A","text":"They are more willing to risk their own lives."},{"id":"B","text":"They are more ambitious than ordinary people."},{"id":"C","text":"They achieve greater nonconventional success."},{"id":"D","text":"They have more positive qualities than most of us."}],"id":"cet4-2023-06-1-q51","number":51,"level":"CET4","correctAnswer":"B","hint":"从首段对创业群体的总体描述判断比较对象。","explanation":"B。首句说创业群体具有“higher-than-average ambition”，即比通常水平更有野心。willing to take more risks不是冒生命危险，也不能据此说他们所有积极品质都比常人多。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author imply by saying “this isn't always the case” (Line l, Para.3)?","passage":"Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and spend more effort to get them.\n\nOverall, this is a positive quality, especially for people trying to build their own businesses. Apparently, if you're more naturally driven to set goals, you are more likely to succeed\n\nActually, this isn't always the case. In fact, in some cases, extreme ambition may end up doing more harm than good.\n\nOne major side effect of excessive ambition is the tendency to focus too determinedly on one particular vision or end goal. This is problematic because it hinders your ability to adapt to new circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to threaten your business, you may need to change direction, even if that means straying from your original vision. If you have too much ambition, you'll find this hard, if not impossible.\n\nFew people are successful when they try to build their first brand. Unfortunately, for the most ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n\nIt's a clear departure from the intended plan toward the intended goal. For people with limited ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and every failure you survive is a learning experience.\n\nAmbitious people tend to be more materialistically successful than their non-ambitious counterparts. However, they're only slightly happier than their less-ambitious counterparts, and tend to live significantly shorter lives. This implies that even though ambitious people are more likely to achieve conventional “success,” such success means nothing for their health and happiness — and if you don't have health and happiness, what else could possibly matter?\n\nClearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn't start your own business, set or achieve goals and get far in life. But an excess of ambition can also be dangerous, putting you at risk of burnout, stubbornness and even a shorter life.","options":[{"id":"A","text":"Ambitious people may not have a greater chance of success."},{"id":"B","text":"Ambitious people may not have more positive qualities."},{"id":"C","text":"Entrepreneurs' ambition does as much good as harm."},{"id":"D","text":"Entrepreneurs are more naturally driven to success."}],"id":"cet4-2023-06-1-q52","number":52,"level":"CET4","correctAnswer":"A","hint":"把this指回前一段的成功概率判断，再看后句转折。","explanation":"A。前段认为更有动力设目标就更可能成功，接着说并非总如此，并解释极端野心可能弊大于利。否定的是野心与成功概率之间的必然关系，不是否定全部积极品质。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author say is of extreme importance for one to become a successful entrepreneur?","passage":"Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and spend more effort to get them.\n\nOverall, this is a positive quality, especially for people trying to build their own businesses. Apparently, if you're more naturally driven to set goals, you are more likely to succeed\n\nActually, this isn't always the case. In fact, in some cases, extreme ambition may end up doing more harm than good.\n\nOne major side effect of excessive ambition is the tendency to focus too determinedly on one particular vision or end goal. This is problematic because it hinders your ability to adapt to new circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to threaten your business, you may need to change direction, even if that means straying from your original vision. If you have too much ambition, you'll find this hard, if not impossible.\n\nFew people are successful when they try to build their first brand. Unfortunately, for the most ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n\nIt's a clear departure from the intended plan toward the intended goal. For people with limited ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and every failure you survive is a learning experience.\n\nAmbitious people tend to be more materialistically successful than their non-ambitious counterparts. However, they're only slightly happier than their less-ambitious counterparts, and tend to live significantly shorter lives. This implies that even though ambitious people are more likely to achieve conventional “success,” such success means nothing for their health and happiness — and if you don't have health and happiness, what else could possibly matter?\n\nClearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn't start your own business, set or achieve goals and get far in life. But an excess of ambition can also be dangerous, putting you at risk of burnout, stubbornness and even a shorter life.","options":[{"id":"A","text":"Holding on to one's original vision."},{"id":"B","text":"Being able to adapt to new situations."},{"id":"C","text":"Focusing determinedly on one particular goal."},{"id":"D","text":"Avoiding radical change in one's career direction."}],"id":"cet4-2023-06-1-q53","number":53,"level":"CET4","correctAnswer":"B","hint":"注意作者称vital的能力与过度执着的弊端形成对照。","explanation":"B。第四段说适应新环境“is vital if you want to be a successful entrepreneur”。执着单一目标会阻碍适应，因此坚持原愿景、拒绝转向都与作者认为重要的能力相反。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"How do the most ambitious entrepreneurs regard failure in their endeavor?","passage":"Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and spend more effort to get them.\n\nOverall, this is a positive quality, especially for people trying to build their own businesses. Apparently, if you're more naturally driven to set goals, you are more likely to succeed\n\nActually, this isn't always the case. In fact, in some cases, extreme ambition may end up doing more harm than good.\n\nOne major side effect of excessive ambition is the tendency to focus too determinedly on one particular vision or end goal. This is problematic because it hinders your ability to adapt to new circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to threaten your business, you may need to change direction, even if that means straying from your original vision. If you have too much ambition, you'll find this hard, if not impossible.\n\nFew people are successful when they try to build their first brand. Unfortunately, for the most ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n\nIt's a clear departure from the intended plan toward the intended goal. For people with limited ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and every failure you survive is a learning experience.\n\nAmbitious people tend to be more materialistically successful than their non-ambitious counterparts. However, they're only slightly happier than their less-ambitious counterparts, and tend to live significantly shorter lives. This implies that even though ambitious people are more likely to achieve conventional “success,” such success means nothing for their health and happiness — and if you don't have health and happiness, what else could possibly matter?\n\nClearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn't start your own business, set or achieve goals and get far in life. But an excess of ambition can also be dangerous, putting you at risk of burnout, stubbornness and even a shorter life.","options":[{"id":"A","text":"It will awaken them to reality."},{"id":"B","text":"It is a lesson they have to learn."},{"id":"C","text":"It means the end of their career."},{"id":"D","text":"It will result in a slow recovery."}],"id":"cet4-2023-06-1-q54","number":54,"level":"CET4","correctAnswer":"C","hint":"看最有野心的创业者怎样解释失败，不要与适度野心者混淆。","explanation":"C。第五段说对最有野心者，失败被视为“disastrous, and impossible to recover from”，即事业终结。下一段把失败当学习经验说的是野心有限者，不能移用到本题主体。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author advise us to do concerning ambition?","passage":"Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and spend more effort to get them.\n\nOverall, this is a positive quality, especially for people trying to build their own businesses. Apparently, if you're more naturally driven to set goals, you are more likely to succeed\n\nActually, this isn't always the case. In fact, in some cases, extreme ambition may end up doing more harm than good.\n\nOne major side effect of excessive ambition is the tendency to focus too determinedly on one particular vision or end goal. This is problematic because it hinders your ability to adapt to new circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to threaten your business, you may need to change direction, even if that means straying from your original vision. If you have too much ambition, you'll find this hard, if not impossible.\n\nFew people are successful when they try to build their first brand. Unfortunately, for the most ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n\nIt's a clear departure from the intended plan toward the intended goal. For people with limited ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and every failure you survive is a learning experience.\n\nAmbitious people tend to be more materialistically successful than their non-ambitious counterparts. However, they're only slightly happier than their less-ambitious counterparts, and tend to live significantly shorter lives. This implies that even though ambitious people are more likely to achieve conventional “success,” such success means nothing for their health and happiness — and if you don't have health and happiness, what else could possibly matter?\n\nClearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn't start your own business, set or achieve goals and get far in life. But an excess of ambition can also be dangerous, putting you at risk of burnout, stubbornness and even a shorter life.","options":[{"id":"A","text":"Distinguish between conventional success and our life goal."},{"id":"B","text":"Follow the example of the most ambitious entrepreneurs."},{"id":"C","text":"Avoid taking unnecessary risks when starting a business."},{"id":"D","text":"Prioritize health and happiness over material success."}],"id":"cet4-2023-06-1-q55","number":55,"level":"CET4","correctAnswer":"D","hint":"关注健康、幸福与传统成功的价值比较。","explanation":"D。第七段说有野心者较可能取得物质成功，但这不保证健康幸福，并反问缺了二者其他还有何意义。由此可知应优先健康幸福，而不是一味模仿极端野心或只讨论创业风险。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","referenceAnswer":"","rubric":[]},{"id":"cet4-2023-06-1-translation","number":"IV","level":"CET4","section":"translation","skill":"translation","type":"short_text_self_check","prompt":"Directions: For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should write your answer on Answer Sheet 2.\n\n中国越来越重视终身教育，发展继续教育是构建终身教育体系的有效途径。高校作为人才培养的基地，拥有先进的教学理念和优越的教学资源，理应成为继续教育的办学主体。因此，近年来许多高校适应社会需求，加强与用人单位沟通，努力探索一条符合中国国情的继续教育发展新路，以使继续教育在国家发展战略中发挥更大的作用。","options":[],"hint":"先分清终身教育与继续教育，再把高校优势、实施措施和目的串联起来。","explanation":"真实段落按价值、主体、行动、目的展开。lifelong education与continuing education不能混为同一概念；高校拥有教学理念和资源，因而应承担主要办学责任。末句措施包括回应社会需求、加强雇主沟通和探索符合国情的道路，最后用so that表达发挥作用的目的。参考译文以一般现在时说明事实、现在完成进行或完成时描述近年来探索，允许准确自然的其他译法。","correctAnswer":"China is attaching increasing importance to lifelong education, and developing continuing education is an effective way to establish a lifelong education system. As institutions that cultivate talent, universities have advanced educational ideas and excellent teaching resources, and should therefore be the main providers of continuing education. In recent years, many universities have responded to social needs, strengthened communication with employers, and worked to explore a new path for continuing education that fits China's circumstances, so that it can play a greater role in the country's development strategy.","referenceAnswer":"China is attaching increasing importance to lifelong education, and developing continuing education is an effective way to establish a lifelong education system. As institutions that cultivate talent, universities have advanced educational ideas and excellent teaching resources, and should therefore be the main providers of continuing education. In recent years, many universities have responded to social needs, strengthened communication with employers, and worked to explore a new path for continuing education that fits China's circumstances, so that it can play a greater role in the country's development strategy.","rubric":["区分终身教育和继续教育","完整译出高校的理念与资源优势","保留社会需求、用人单位沟通和国情三个要点","表达在国家发展战略中发挥更大作用的目的"],"guidance":"参考范文为本项目编写，允许其他正确表达；完成后按要点自评，不计入客观正确率。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","passage":""}],"answers":[],"drafts":{}},"question":{"type":"single_choice","skill":"listening","section":"听力理解","prompt":"What do we learn from the report about the 55-year-old woman?","passage":"","options":[{"id":"A","text":"She was involved in a conflict with bird lovers."},{"id":"B","text":"She was charged with mistreating animals."},{"id":"C","text":"She was on bad terms with her neighbors."},{"id":"D","text":"She was accused of violating a city law."}],"id":"cet4-2023-06-1-q1","number":1,"level":"CET4","correctAnswer":"D","hint":"先听清新闻开头指控的内容，并区分喂鸟与虐待动物。","explanation":"D。开头的“charged with ... violating ... city law”明确是违反城市法规的指控，不是虐待动物。邻居抱怨和喂鸟只是报道背景，不能替代指控内容。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","audioUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio","listeningTranscript":"A woman was charged with allegedly violating a Rhode Island city law against feeding wild animals. The 55-year-old woman's neighbors blame her for making the area's rat problem worse. Newly installed cameras captured several rats active in the middle of the day. Neighbors say that it's even worse during the night. The woman and her parents, who own the home, told reporters that she's being charged for feeding birds. \"Who would have known just loving animals gets you that much trouble,\"she said. It is prohibited to feed any wild animals including birds in Rhode Island City. Nevertheless, while the woman's intention was to feed birds, it is clear that rats were also benefiting. Anthony Moretti, director of the city administration, said he saw more than 20 rats near the woman's home. He said it will take months to get the problem under control.","referenceAnswer":"","rubric":[],"numberLabel":"第 1 题"},"answer":"","feedback":null,"hint":"","hintLoading":false,"savedNote":"","result":null,"review":[],"navigation":[{"id":"cet4-2023-06-1-writing","index":0,"number":"I","section":"写作","checked":false},{"id":"cet4-2023-06-1-q1","index":1,"number":1,"section":"听力理解","checked":false},{"id":"cet4-2023-06-1-q2","index":2,"number":2,"section":"听力理解","checked":false},{"id":"cet4-2023-06-1-q3","index":3,"number":3,"section":"听力理解","checked":false},{"id":"cet4-2023-06-1-q4","index":4,"number":4,"section":"听力理解","checked":false},{"id":"cet4-2023-06-1-q5","index":5,"number":5,"section":"听力理解","checked":false},{"id":"cet4-2023-06-1-q6","index":6,"number":6,"section":"听力理解","checked":false},{"id":"cet4-2023-06-1-q7","index":7,"number":7,"section":"听力理解","checked":false},{"id":"cet4-2023-06-1-q8","index":8,"number":8,"section":"听力理解","checked":false},{"id":"cet4-2023-06-1-q9","index":9,"number":9,"section":"听力理解","checked":false},{"id":"cet4-2023-06-1-q10","index":10,"number":10,"section":"听力理解","checked":false},{"id":"cet4-2023-06-1-q11","index":11,"number":11,"section":"听力理解","check ng' ? '真寻正在搬运新鲜事…' : (state === 'success' ? '刷新好啦，给你比个心！' : (state === 'error' ? '没连上，再拉一次试试' : (state === 'ready' ? '松手，让真寻出发！' : '下拉，和真寻一起刷新')))}}</text><text class=\"note\">{{state === 'success' ? '你的小小日常，已更新 ✧' : (state === 'error' ? '保留原有内容，稍后重试' : 'MAHIRO · CAMPUS DAILY')}}</text></view>\r\n  </view>\r\n  <slot />\r\n</scroll-view>\r\n\r\n","defaults":{"triggered":false,"state":"pull","imageFailed":false},"css":":host { display: block; height: 100%; min-height: 0; }\n.scroll { height: 100%; width: 100%; }\n.refresh { width: 100%; height: 80px; display: flex; align-items: center; justify-content: center; gap: 18rpx; background: #f2f6fa; }\n.character { width: 128rpx; height: 144rpx; position: relative; flex-shrink: 0; }\n.mahiro { width: 100%; height: 100%; transform-origin: 50% 85%; transition: transform .2s; }\n.sparkle { position: absolute; right: -8rpx; top: 22rpx; color: #b091dc; font-size: 25rpx; }\n.fallback { display: block; line-height: 144rpx; text-align: center; color: #b091dc; font-size: 72rpx; }\n.copy { display: flex; flex-direction: column; gap: 10rpx; min-width: 0; }\n.title { font-size: 25rpx; color: #685680; font-weight: 650; }\n.note { font-size: 18rpx; color: #a096af; letter-spacing: 1rpx; }\n.refresh--ready .mahiro { transform: rotate(-8deg) translateY(-5rpx); }\n.refresh--loading .mahiro { animation: mahiro-bounce .65s ease-in-out infinite; }\n.refresh--loading .sparkle { animation: mahiro-sparkle .8s ease-in-out infinite; }\n.refresh--success .mahiro { animation: mahiro-cheer .6s ease-out; }\n.refresh--error .mahiro { transform: rotate(6deg); }\n.refresh--error .title { color: #a96982; }\n@keyframes mahiro-bounce { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10rpx) rotate(4deg); } }\n@keyframes mahiro-sparkle { 0%,100% { opacity: .35; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.2); } }\n@keyframes mahiro-cheer { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-16rpx) rotate(-8deg); } 70% { transform: rotate(6deg); } }\n@media (prefers-reduced-motion: reduce) { .mahiro,.sparkle { animation: none !important; transition: none; } }\n"},"tech-loader":{"template":"<view class=\"loader\" aria-label=\"正在加载\"><view class=\"square\"><view class=\"edge edge--0\"/><view class=\"edge edge--1\"/><view class=\"edge edge--2\"/><view class=\"edge edge--3\"/></view></view>\n","defaults":{},"css":"/* codebykay101/dull-shrimp-28: the four moving edges and orbiting square. */\r\n:host { display:block; }\r\n.loader { height:100rpx; display:flex; align-items:center; justify-content:center; }.square { position:relative; width:64rpx; height:64rpx; border:1rpx solid #d1def2; }.square::before { content:\"\"; position:absolute; width:8rpx; height:8rpx; background:#879edc; box-shadow:0 0 0 5rpx #aebdea22,0 0 12rpx #aebdea66; animation:square-orbit 4s linear infinite; }\r\n.edge { position:absolute; inset:4rpx; overflow:hidden; }.edge--1 { transform:rotate(90deg); }.edge--2 { transform:rotate(180deg); }.edge--3 { transform:rotate(270deg); }.edge::before { content:\"\"; position:absolute; width:100%; height:2rpx; background:#879edc; transform:translateX(-100%); animation:edge-flow 4s linear infinite; }.edge--1::before { animation-delay:1s; }.edge--2::before { animation-delay:2s; }.edge--3::before { animation-delay:3s; }\r\n@keyframes square-orbit { 0%,100% { transform:translate(-4rpx,-4rpx); } 25% { transform:translate(60rpx,-4rpx); } 50% { transform:translate(60rpx,60rpx); } 75% { transform:translate(-4rpx,60rpx); } }\r\n@keyframes edge-flow { 0% { transform:translateX(-100%); } 50%,100% { transform:translateX(100%); } }\r\n@media (prefers-reduced-motion:reduce) { .square::before,.edge::before { animation:none; } }\r\n"},"english-nav":{"template":"<view class=\"english-nav\">\n  <button wx:for=\"{{items}}\" wx:key=\"id\" class=\"nav-item {{current === item.id ? 'is-current' : ''}}\" data-id=\"{{item.id}}\" bindtap=\"switchSection\" hover-class=\"nav-pressed\" aria-label=\"{{item.label}}分区\" aria-current=\"{{current === item.id ? 'page' : ''}}\"><view class=\"nav-indicator\"></view><text class=\"nav-label\">{{item.label}}</text></button>\n</view>\n","defaults":{"items":[{"id":"words","label":"单词","page":"index"},{"id":"papers","label":"真题","page":"papers"},{"id":"challenge","label":"挑战","page":"challenge"},{"id":"rank","label":"榜单","page":"rank"}],"current":"words","level":"CET4"},"css":":host { display:block; }\n.english-nav { position:fixed; z-index:50; left:0; right:0; bottom:0; display:flex; gap:8px; align-items:center; padding:8px 16px calc(8px + env(safe-area-inset-bottom)); background:#fffffffa; border-top:1px solid #e9edf4; box-shadow:0 -4px 18px #41507706; }\n.english-nav button.nav-item { display:flex; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:7px; width:auto; min-width:44px; min-height:48px; margin:0; padding:8px 0; line-height:1.4; color:#9097a8; background:transparent; border-radius:12px; }\n.nav-item::after { border:0; }\n.nav-label { font-size:14px; font-weight:600; }\n.nav-indicator { width:20px; height:3px; border-radius:3px; background:transparent; }\n.english-nav button.is-current { color:var(--campus-theme-accent,#6574ca); background:var(--campus-theme-soft,#f1f3fb); }\n.is-current .nav-indicator { background:var(--campus-theme-accent,#6574ca); }\n.nav-pressed { opacity:.65; }\n"}})</script></body></html>

-q53","cet4-2023-06-1-q54","cet4-2023-06-1-q55","cet4-2023-06-1-translation"],"durationSeconds":6000,"description":"真实题面与机构参考答案已核对，解析和参考作文为本项目编写。含55道客观题、写作与翻译；听力使用原音。","sourceId":"cet4-2023-06-1","resources":[{"id":"cet4-2023-06-1-audio","title":"原卷听力音频","type":"audio","url":"https://raw.githubusercontent.com/0609x/CET46-Resources/main/%E5%9B%9B%E7%BA%A7%E7%9C%9F%E9%A2%98/2023.06/%E5%90%AC%E5%8A%9B%E9%9F%B3%E9%A2%91/2023%E5%B9%B46%E6%9C%88%E7%AC%AC1%E5%A5%97%E8%8B%B1%E8%AF%AD%E5%9B%9B%E7%BA%A7%E7%9C%9F%E9%A2%98%E5%90%AC%E5%8A%9B%E9%9F%B3%E9%A2%91.mp3","downloadUrl":"/api/english/resource?paperId=cet4-2023-06-1&type=audio"}],"coverage":{"fullNonListening":true,"listeningExcluded":true}},"mode":"exam","status":"active","completed":0,"total":32,"question":{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What are big houses promoted to be in the United States?","passage":"The United States is facing a housing crisis: Affordable housing is inadequate, while luxury homes abound (充裕), and homelessness remains a persistent problem. Despite this, popular culture and the housing industry market happiness as living with both more space and more amenities (便利设施). Big houses are adverted as a reward for hard work and diligence, turning housing from a basic necessity into a luxury.\n\nThis is reflected in our homes. The average single-family home built in the United States before 1970 was less than 1,500 square feet in size. By 2016, the average size of a new, single-family home was 2,422 square feet. What's more, homes built in the 2000s were more likely than earlier models to have more of all types of spaces: bedrooms, bathrooms, living rooms, dining rooms, recreation rooms and garages.\n\nThere are consequences of living big. As middle-class houses have grown larger, two things have happened. First, large houses take time to maintain, so cleaners and other low-wage service workers are required to keep these houses in order. Second, once-public spaces, where people from diverse backgrounds used to come together, have increasingly become privatized, leading to a reduction in the number of public facilities available to all, and a reduced quality of life for many. Take swimming pools. While in 1950, only 2,500 U.S. families owned pools, by 1999 this number was 4 million. At the same time, public municipal pools were often closed, leaving low-income people nowhere to swim.\n\nThe trend for bigger housing thus poses ethical questions. Should Americans accept a system in which the middle and upper classes enjoy a luxurious lifestyle, using the low-wage labor of others? Are we willing to accept a system in which an increase in amenities purchased by the affluent means a reduction in amenities for the poor?\n\nI believe neither is acceptable. We must change the way we think: living well does not need to mean having more private spaces; instead, it could mean having more public spaces. A better goal than building bigger houses for some is to create more publicly accessible spaces and amenities for all.","options":[{"id":"A","text":"A luxury for the homeless."},{"id":"B","text":"A reward for industriousness."},{"id":"C","text":"An abundant source of comforts."},{"id":"D","text":"An absolute necessity for happiness."}],"id":"cet4-2023-06-1-q46","number":46,"level":"CET4","correctAnswer":"B","hint":"找首段广告如何把大房子与勤奋工作联系起来。","explanation":"B。首段“a reward for hard work and diligence”直接对应a reward for industriousness。作者在描述营销说法，不是在主张无家可归者应获得奢侈品或所有幸福都依赖豪宅。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q46","referenceAnswer":"","rubric":[]},"questions":[{"id":"cet4-2023-06-1-writing","number":"I","level":"CET4","section":"writing","skill":"writing","type":"short_text_self_check","prompt":"Directions: Suppose your university is conducting a survey to collect students' opinions of online classes. You are to write a response to the survey about their advantages and disadvantages,and what improvements can be made. You will have 30 minutes for the task. You should write at least 120 words but no more than 180 words.","options":[],"hint":"按调查反馈写作：先总结体验，再分别讨论优缺点，最后提出可实施的改进。","explanation":"这份真实写作题要求回应学校关于网课的调查，因此必须涵盖优点、缺点和改进三个方面。参考文章先交代态度，再用录播与通勤节省说明便利，用注意力、交流和设备说明限制，最后提出短单元、讨论环节与技术支持。检查120–180词、是否回应调查而非只谈网络，以及建议是否针对前述问题；并不要求照抄范文。","correctAnswer":"In response to the university's survey, I think online classes can be valuable when they are carefully designed. They allow students to attend lessons from different places and save time spent travelling. Recorded lectures are especially helpful because we can replay a difficult explanation at our own pace. However, online learning also has weaknesses. It is easy to become distracted, and students may hesitate to ask questions without direct contact with their teachers. An unreliable connection can interrupt a lesson or prevent someone from joining a discussion. To improve these classes, teachers could divide long lectures into shorter units and include regular discussions or small tasks. The university should provide technical support and a quiet room for students who lack suitable equipment. Clear deadlines and timely feedback would also help us remain engaged. With these improvements, online classes could offer greater flexibility while maintaining the interaction needed for effective learning.","referenceAnswer":"In response to the university's survey, I think online classes can be valuable when they are carefully designed. They allow students to attend lessons from different places and save time spent travelling. Recorded lectures are especially helpful because we can replay a difficult explanation at our own pace. However, online learning also has weaknesses. It is easy to become distracted, and students may hesitate to ask questions without direct contact with their teachers. An unreliable connection can interrupt a lesson or prevent someone from joining a discussion. To improve these classes, teachers could divide long lectures into shorter units and include regular discussions or small tasks. The university should provide technical support and a quiet room for students who lack suitable equipment. Clear deadlines and timely feedback would also help us remain engaged. With these improvements, online classes could offer greater flexibility while maintaining the interaction needed for effective learning.","rubric":["正文120–180个英文词","同时讨论网课优势与不足","提出至少一项对应问题的改进","内容连贯，语法与用词准确"],"guidance":"参考范文为本项目编写，允许其他正确表达；完成后按要点自评，不计入客观正确率。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-writing","passage":""},{"type":"single_choice","skill":"reading","section":"reading_word_bank","prompt":"选词填空：为第 26 空选择合适的单词。每个选项最多使用一次。","passage":"You probably haven't taken the time to think of all the work that went into creating the shirt on your back. I mean, how hard it could be to create fabric and [26] ____ it into a shirt shape. Don't machines do all that? Well, creating fabric from cotton, which is the most [27] ____ clothing material, is actually a process that involves a lot of water, 2, 700 liters per shirt to be [28] ____. Take a look at the video below from National Geographic for some more mind-blowing [29] ____ about cotton clothing production.\n\nClean water is [30] ____ becoming one of the most sought-after resources in the world. Given how large the [31] ____ and cotton industries are, they take up a lot of our fresh water demands across the world, according to The Huffington Post. The video from National Geographic was created to spread [32] ____ of how environmentally harmful cotton is. But the situation can be made better. Through better water management and farming practices, water usage in cotton production can be cut down by [33] ____ 40 percent.\n\nCalled “Better Cotton”, this environmentally conscious product will save millions of liters of water a year simply from [34] ____ the demands of cotton production. Cotton doesn't have t":"reckoning"},{"id":"K","text":"reducing"},{"id":"L","text":"sew"},{"id":"M","text":"shrink"},{"id":"N","text":"statistics"},{"id":"O","text":"textile"}],"id":"cet4-2023-06-1-q35","number":35,"level":"CET4","correctAnswer":"M","hint":"注意as从句需要与water supplies搭配的谓语。","explanation":"M，shrink，缩减。as water supplies shrink表示随着供水减少，农民和消费者更应注意环境影响。空格须有时态谓语，reducing不能单独作此从句的谓语。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q35","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_matching","prompt":"According to Francis Dittoh, their speech-based weather information service was meant to be inexpensive and easy to use.","passage":"The spoken web\n\nA) We're growing more used to chatting to our computers, phones and smart speakers through voice assistants like Amazon's Alexa, Apple's Siri and Microsoft's Cortana. Blind and partially sighted people have been using text-to-speech converters for decades.\n\nB) Out of these assistants, Siri is the most well-known. The assistant uses voice inquiries and a natural-language user interface (界面)to answer questions. The software adapts to users' individual language usages, searches, and preferences, with continuing use.\n\nC) Some think voice could soon take over from typing and clicking as the main way to interact online. But what are the challenges of moving to “the spoken web”?\n\nD) What use is written online content if you can't read? That is the situation facing illiterate (不识字的)African farmers. They are often denied crucial information the web offers many others. With a literacy rate in some parts of Africa at only 22.6%, farmers are often “underpaid for their produce because they might be unaware of the prevailing prices,” says Francis Dittoh, a researcher behind Mr Meteo, a speech-based weather information service.\n\nE) “The most frequently heard complaint is about rainfall predictions,” says Mr Dittoh, who lives in Tamale, northern Ghana. “They tell us the methods their forefathers used to predict the weather don't seem to work as well these days. \"This is down to climate change, he believes. Yet knowing when it's going to rain is vital for farmers wanting to sow seeds, irrigate crops or take their animals out to the fields to feed on grass.\n\nF) Mr Dittoh says the idea of converting online weather reports into speech came from the farmers themselves, after a workshop in the village of Guabuligah. \"They came up with this,” he says. Mr Meteo takes the online weather forecast, converts it to a short recording in the appropriate language and makes it available on a basic phone. Farmers ring up to receive the information. The local language Dagbani is spoken by 1. 2 million people but is not served by any online translation applications. The service was designed to be cheap and easy to run, says Mr Dittoh. He plans to begin field tests this month, working with Tamale's Savanna Agricultural Research Institute.\n\nG) The spoken web could also help the one-in-five adults in Europe and the U.S. with poor reading skills. But building the spoken web-web-to-voice and voice-to-web-isn't straightforward. For software to understand pizza is served at Italian restaurants is easy. To cover multiple domains and to be able to have a conversation with users on every single topic is still a long way off.\n\nH) So although many computer assistants can answer simple questions about the weather and play music for us, anything resembling a wide-ranging human conversation is decades away. Artificial intelligence just isn't smart enough yet. Even turning your voice into text — automatic speech recognition — is one of the hardest problems to solve, as there are as many ways to pronounce things as there are people on the planet.\n\nI) Siri has often been praised for its ability to interpret our casual language and deliver very specific and accurate results, sometimes even providing additional information. But it is still somewhat restricted, particularly when the language moves away from stiffer commands into more human interactions. In one example, the phrase “Send a text to Jason, Clint, Sam, and Lee saying we're having dinner at Silver Cloud restaurant” was interpreted as sending a message to Jason only, containing the text “Clint Sam and Lee saying we're having dinner at Silver Cloud restaurant\". It has also been noted that Siri lacks a proper editing function, as saying “Edit message to say: we're at Silver Cloud restaurant and you should come find us\"generates \"Clint Sam and Lee saying we're having dinner at Silver Cloud restaurant to say we're at Silver Cloud restaurant and you should come find us\".\n\nJ) Using voice interaction feels far more intimate than surfing the net the old-fashioned way. This is intentional as the informal tone of the assistant helps create an emotional attachment. But if something speaks, it must also listen. Our phones are always near us and they are collecting data about us all the time. This has already raised privacy concerns. The American Civil Liberties Union has stated that digital assistants create a threat to privacy from hackers. Some people have other concerns. They worry assistants will one day be used to deliver advertising directly to us.\n\nK) But digital voices need more personality to make them popular. Robots are not yet witty, Siri is boring. The benefits of using voice instead of tapping fingers obviously. depend on the context. Doctors completing online forms about their patients by speech, for example, can dictate 150 words a minute, three times faster than typing on a keyboard. This enables them to spend less time on administration and more time with patients.\n\nL) Last year, speech recognition company Nuance helped a doctors' surgery in Dukinfield, near Manchester, set up a speech system for the practice's six doctors. Now they can dictate notes on a patient's health condition and treatment and a smart assistant automatically enters the information into the right fields on a web form. Previously, the doctors made voice recordings that were then transcribed by secretaries — a process that was costly and likely to cause delays. The new system means letters to patients now have more detail.\n\nM) Using voice also makes sense when you're doing other things with your hands. Think about when you're cooking, and you just want to know what the next step in the recipe is. Your hands are covered with oil; you're not going to get on the iPad, so it's a lot more natural to talk. And speech obviously makes sense when you're driving. In the U.S., 29%of drivers admit they surf behind the wheel, according to insurance firm State Farm. This is up from 13% in 2009. No wonder using mobile phones while driving causes more crashes a year than drink driving, says the U.S. National Safety Council.","options":[{"id":"A","text":"A 段"},{"id":"B","text":"B 段"},{"id":"C","text":"C 段"},{"id":"D","text":"D 段"},{"id":"E","text":"E 段"},{"id":"F","text":"F 段"},{"id":"G","text":"G 段"},{"id":"H","text":"H 段"},{"id":"I","text":"I 段"},{"id":"J","text":"J 段"},{"id":"K","text":"K 段"},{"id":"L","text":"L 段"},{"id":"M","text":"M 段"}],"id":"cet4-2023-06-1-q36","number":36,"level":"CET4","correctAnswer":"F","hint":"寻找描述气象语音服务成本和操作难度的词组。","explanation":"F段说“The service was designed to be cheap and easy to run”，与题干inexpensive and easy to use同义。主体是Francis Dittoh的气象服务，而不是一般语音助手的市场价格。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q36","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_matching","prompt":"Using voice instead of typing enables doctors to spend more time taking care of patients.","passage":"The spoken web\n\nA) We're growing more used to chatting to our computers, phones and smart speakers through voice assistants like Amazon's Alexa, Apple's Siri and Microsoft's Cortana. Blind and partially sighted people have been using text-to-speech conv ng speaks, it must also listen. Our phones are always near us and they are collecting data about us all the time. This has already raised privacy concerns. The American Civil Liberties Union has stated that digital assistants create a threat to privacy from hackers. Some people have other concerns. They worry assistants will one day be used to deliver advertising directly to us.\n\nK) But digital voices need more personality to make them popular. Robots are not yet witty, Siri is boring. The benefits of using voice instead of tapping fingers obviously. depend on the context. Doctors completing online forms about their patients by speech, for example, can dictate 150 words a minute, three times faster than typing on a keyboard. This enables them to spend less time on administration and more time with patients.\n\nL) Last year, speech recognition company Nuance helped a doctors' surgery in Dukinfield, near Manchester, set up a speech system for the practice's six doctors. Now they can dictate notes on a patient's health condition and treatment and a smart assistant automatically enters the information into the right fields on a web form. Previously, the doctors made voice recordings that were then transcribed by secretaries — a process that was costly and likely to cause delays. The new system means letters to patients now have more detail.\n\nM) Using voice also makes sense when you're doing other things with your hands. Think about when you're cooking, and you just want to know what the next step in the recipe is. Your hands are covered with oil; you're not going to get on the iPad, so it's a lot more natural to talk. And speech obviously makes sense when you're driving. In the U.S., 29%of drivers admit they surf behind the wheel, according to insurance firm State Farm. This is up from 13% in 2009. No wonder using mobile phones while driving causes more crashes a year than drink driving, says the U.S. National Safety Council.","options":[{"id":"A","text":"A 段"},{"id":"B","text":"B 段"},{"id":"C","text":"C 段"},{"id":"D","text":"D 段"},{"id":"E","text":"E 段"},{"id":"F","text":"F 段"},{"id":"G","text":"G 段"},{"id":"H","text":"H 段"},{"id":"I","text":"I 段"},{"id":"J","text":"J 段"},{"id":"K","text":"K 段"},{"id":"L","text":"L 段"},{"id":"M","text":"M 段"}],"id":"cet4-2023-06-1-q45","number":45,"level":"CET4","correctAnswer":"J","hint":"注意手机持续收集数据与隐私担忧之间的因果。","explanation":"J段说手机一直在身边并持续“collecting data about us all the time”，这“raised privacy concerns”。题干个人信息收集与concerned about privacy分别对应这两个信息点。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q45","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What are big houses promoted to be in the United States?","passage":"The United States is facing a housing crisis: Affordable housing is inadequate, while luxury homes abound (充裕), and homelessness remains a persistent problem. Despite this, popular culture and the housing industry market happiness as living with both more space and more amenities (便利设施). Big houses are adverted as a reward for hard work and diligence, turning housing from a basic necessity into a luxury.\n\nThis is reflected in our homes. The average single-family home built in the United States before 1970 was less than 1,500 square feet in size. By 2016, the average size of a new, single-family home was 2,422 square feet. What's more, homes built in the 2000s were more likely than earlier models to have more of all types of spaces: bedrooms, bathrooms, living rooms, dining rooms, recreation rooms and garages.\n\nThere are consequences of living big. As middle-class houses have grown larger, two things have happened. First, large houses take time to maintain, so cleaners and other low-wage service workers are required to keep these houses in order. Second, once-public spaces, where people from diverse backgrounds used to come together, have increasingly become privatized, leading to a reduction in the number of public facilities available to all, and a reduced quality of life for many. Take swimming pools. While in 1950, only 2,500 U.S. families owned pools, by 1999 this number was 4 million. At the same time, public municipal pools were often closed, leaving low-income people nowhere to swim.\n\nThe trend for bigger housing thus poses ethical questions. Should Americans accept a system in which the middle and upper classes enjoy a luxurious lifestyle, using the low-wage labor of others? Are we willing to accept a system in which an increase in amenities purchased by the affluent means a reduction in amenities for the poor?\n\nI believe neither is acceptable. We must change the way we think: living well does not need to mean having more private spaces; instead, it could mean having more public spaces. A better goal than building bigger houses for some is to create more publicly accessible spaces and amenities for all.","options":[{"id":"A","text":"A luxury for the homeless."},{"id":"B","text":"A reward for industriousness."},{"id":"C","text":"An abundant source of comforts."},{"id":"D","text":"An absolute necessity for happiness."}],"id":"cet4-2023-06-1-q46","number":46,"level":"CET4","correctAnswer":"B","hint":"找首段广告如何把大房子与勤奋工作联系起来。","explanation":"B。首段“a reward for hard work and diligence”直接对应a reward for industriousness。作者在描述营销说法，不是在主张无家可归者应获得奢侈品或所有幸福都依赖豪宅。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q46","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What is one of the consequences of living big?","passage":"The United States is facing a housing crisis: Affordable housing is inadequate, while luxury homes abound (充裕), and homelessness remains a persistent problem. Despite this, popular culture and the housing industry market happiness as living with both more space and more amenities (便利设施). Big houses are adverted a affordable housing."},{"id":"D","text":"One in which the affluent enjoy a more comfortable life at the expense of the poor."}],"id":"cet4-2023-06-1-q49","number":49,"level":"CET4","correctAnswer":"D","hint":"结合第四段两个问句与第五段的否定理解作者立场。","explanation":"D。作者不接受富人的设施增加意味着穷人的设施减少的制度；D概括为富人舒适生活以穷人的损失为代价。B只讲价格、C只讲住房，均缩窄或改变了文章讨论的制度问题。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q49","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author advocate for people to live well?","passage":"The United States is facing a housing crisis: Affordable housing is inadequate, while luxury homes abound (充裕), and homelessness remains a persistent problem. Despite this, popular culture and the housing industry market happiness as living with both more space and more amenities (便利设施). Big houses are adverted as a reward for hard work and diligence, turning housing from a basic necessity into a luxury.\n\nThis is reflected in our homes. The average single-family home built in the United States before 1970 was less than 1,500 square feet in size. By 2016, the average size of a new, single-family home was 2,422 square feet. What's more, homes built in the 2000s were more likely than earlier models to have more of all types of spaces: bedrooms, bathrooms, living rooms, dining rooms, recreation rooms and garages.\n\nThere are consequences of living big. As middle-class houses have grown larger, two things have happened. First, large houses take time to maintain, so cleaners and other low-wage service workers are required to keep these houses in order. Second, once-public spaces, where people from diverse backgrounds used to come together, have increasingly become privatized, leading to a reduction in the number of public facilities available to all, and a reduced quality of life for many. Take swimming pools. While in 1950, only 2,500 U.S. families owned pools, by 1999 this number was 4 million. At the same time, public municipal pools were often closed, leaving low-income people nowhere to swim.\n\nThe trend for bigger housing thus poses ethical questions. Should Americans accept a system in which the middle and upper classes enjoy a luxurious lifestyle, using the low-wage labor of others? Are we willing to accept a system in which an increase in amenities purchased by the affluent means a reduction in amenities for the poor?\n\nI believe neither is acceptable. We must change the way we think: living well does not need to mean having more private spaces; instead, it could mean having more public spaces. A better goal than building bigger houses for some is to create more publicly accessible spaces and amenities for all.","options":[{"id":"A","text":"Finding ways to turn private spaces into public ones."},{"id":"B","text":"Building more houses affordable to those less affluent."},{"id":"C","text":"More public spaces created for everyone to enjoy."},{"id":"D","text":"All amenities made accessible to the rich and the poor alike."}],"id":"cet4-2023-06-1-q50","number":50,"level":"CET4","correctAnswer":"C","hint":"区分作者主张增加公共空间与把所有私产一律共享。","explanation":"C。末段提出“create more publicly accessible spaces and amenities for all”，即创造更多公共空间供所有人享受。文章没有要求把全部私有空间或全部设施转为公共所有。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q50","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author think of most entrepreneurs?","passage":"Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and spend more effort to get them.\n\nOverall, this is a positive quality, especially for people trying to build their own businesses. Apparently, if you're more naturally driven to set goals, you are more likely to succeed\n\nActually, this isn't always the case. In fact, in some cases, extreme ambition may end up doing more harm than good.\n\nOne major side effect of excessive ambition is the tendency to focus too determinedly on one particular vision or end goal. This is problematic because it hinders your ability to adapt to new circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to threaten your business, you may need to change direction, even if that means straying from your original vision. If you have too much ambition, you'll find this hard, if not impossible.\n\nFew people are successful when they try to build their first brand. Unfortunately, for the most ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n\nIt's a clear departure from the intended plan toward the intended goal. For people with limited ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and every failure you survive is a learning experience.\n\nAmbitious people tend to be more materialistically successful than their non-ambitious counterparts. However, they're only slightly happier than their less-ambitious counterparts, and tend to live significantly shorter lives. This implies that even though ambitious people are more likely to achieve conventional “success,” such success means nothing for their health and happiness — and if you don't have health and happiness, what else could possibly matter?\n\nClearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn't start your own business, set or achieve goals and get far in life. But an excess of ambition can also be dangerous, putting you at risk of burnout, stubbornness and even a shorter life.","options":[{"id":"A","text":"They are more willing to risk their own lives."},{"id":"B","text":"They are more ambitious than ordinary people."},{"id":"C","text":"They achieve greater nonconventional success."},{"id":"D","text":"They have more positive qualities than most of us."}],"id":"cet4-2023-06-1-q51","number":51,"level":"CET4","correctAnswer":"B","hint":"从首段对创业群体的总体描述判断比较对象。","explanation":"B。首句说创业群体具有“higher-than-average ambition”，即比通常水平更有野心。willing to take more risks不是冒生命危险，也不能据此说他们所有积极品质都比常人多。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q51","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author imply by saying “this isn't always the case” (Line l, Para.3)?","passage":"Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and spend more effort to get them.\n\nOverall, this is a positive quality, especially for people trying to build their own businesses. Apparently, if you're more naturally driven to set goals, you are more likely to succeed\n\nActually, this isn't always the case. In fact, in some cases, extreme ambition may end up doing more harm than good.\n\nOne major side effect of excessive ambition is the tendency to focus too determinedly on one particular vision or end goal. This is problematic because it hinders your ability to adapt to new circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to threaten your business, you may need to change direction, even if that means straying from your original vision. If you have too much ambition, you'll find this hard, if not impossible.\n\nFew people are successful when they try to build their first brand. Unfortunately, for the most ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n\nIt's a clear departure from the intended plan toward the intended goal. For people with limited ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and every failure you survive is a learning experience.\n\nAmbitious people tend to be more materialistically successful than their non-ambitious counterparts. However, they're only slightly happier than their less-ambitious counterparts, and tend to live significantly shorter lives. This implies that even though ambitious people are more likely to achieve conventional “success,” such success means nothing for their health and happiness — and if you don't have health and happiness, what else could possibly matter?\n\nClearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn't start your own business, set or achieve goals and get far in life. But an excess of ambition can also be dangerous, putting you at risk of burnout, stubbornness and even a shorter life.","options":[{"id":"A","text":"Ambitious people may not have a greater chance of success."},{"id":"B","text":"Ambitious people may not have more positive qualities."},{"id":"C","text":"Entrepreneurs' ambition does as much good as harm."},{"id":"D","text":"Entrepreneurs are more naturally driven to success."}],"id":"cet4-2023-06-1-q52","number":52,"level":"CET4","correctAnswer":"A","hint":"把this指回前一段的成功概率判断，再看后句转折。","explanation":"A。前段认为更有动力设目标就更可能成功，接着说并非总如此，并解释极端野心可能弊大于利。否定的是野心与成功概率之间的必然关系，不是否定全部积极品质。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q52","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author say is of extreme importance for one to become a successful entrepreneur?","passage":"Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and spend more effort to get them.\n\nOverall, this is a positive quality, especially for people trying to build their own businesses. Apparently, if you're more naturally driven to set goals, you are more likely to succeed\n\nActually, this isn't always the case. In fact, in some cases, extreme ambition may end up doing more harm than good.\n\nOne major side effect of excessive ambition is the tendency to focus too determinedly on one particular vision or end goal. This is problematic because it hinders your ability to adapt to new circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to threaten your business, you may need to change direction, even if that means straying from your original vision. If you have too much ambition, you'll find this hard, if not impossible.\n\nFew people are successful when they try to build their first brand. Unfortunately, for the most ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n\nIt's a clear departure from the intended plan toward the intended goal. For people with limited ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and every failure you survive is a learning experience.\n\nAmbitious people tend to be more materialistically successful than their non-ambitious counterparts. However, they're only slightly happier than their less-ambitious counterparts, and tend to live significantly shorter lives. This implies that even though ambitious people are more likely to achieve conventional “success,” such success means nothing for their health and happiness — and if you don't have health and happiness, what else could possibly matter?\n\nClearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn't start your own business, set or achieve goals and get far in life. But an excess of ambition can also be dangerous, putting you at risk of burnout, stubbornness and even a shorter life.","options":[{"id":"A","text":"Holding on to one's original vision."},{"id":"B","text":"Being able to adapt to new situations."},{"id":"C","text":"Focusing determinedly on one particular goal."},{"id":"D","text":"Avoiding radical change in one's career direction."}],"id":"cet4-2023-06-1-q53","number":53,"level":"CET4","correctAnswer":"B","hint":"注意作者称vital的能力与过度执着的弊端形成对照。","explanation":"B。第四段说适应新环境“is vital if you want to be a successful entrepreneur”。执着单一目标会阻碍适应，因此坚持原愿景、拒绝转向都与作者认为重要的能力相反。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q53","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"How do the most ambitious entrepreneurs regard failure in their endeavor?","passage":"Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and spend more effort to get them.\n\nOverall, this is a positive quality, especially for people trying to build their own businesses. Apparently, if you're more naturally driven to set goals, you are more likely to succeed\n\nActually, this isn't always the case. In fact, in some cases, extreme ambition may end up doing more harm than good.\n\nOne major side effect of excessive ambition is the tendency to focus too determinedly on one particular vision or end goal. This is problematic because it hinders your ability to adapt to new circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to threaten your business, you may need to change direction, even if that means straying from your original vision. If you have too much ambition, you'll find this hard, if not impossible.\n\nFew people are successful when they try to build their first brand. Unfortunately, for the most ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n\nIt's a clear departure from the intended plan toward the intended goal. For people with limited ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and every failure you survive is a learning experience.\n\nAmbitious people tend to be more materialistically successful than their non-ambitious counterparts. However, they're only slightly happier than their less-ambitious counterparts, and tend to live significantly shorter lives. This implies that even though ambitious people are more likely to achieve conventional “success,” such success means nothing for their health and happiness — and if you don't have health and happiness, what else could possibly matter?\n\nClearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn't start your own business, set or achieve goals and get far in life. But an excess of ambition can also be dangerous, putting you at risk of burnout, stubbornness and even a shorter life.","options":[{"id":"A","text":"It will awaken them to reality."},{"id":"B","text":"It is a lesson they have to learn."},{"id":"C","text":"It means the end of their career."},{"id":"D","text":"It will result in a slow recovery."}],"id":"cet4-2023-06-1-q54","number":54,"level":"CET4","correctAnswer":"C","hint":"看最有野心的创业者怎样解释失败，不要与适度野心者混淆。","explanation":"C。第五段说对最有野心者，失败被视为“disastrous, and impossible to recover from”，即事业终结。下一段把失败当学习经验说的是野心有限者，不能移用到本题主体。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q54","referenceAnswer":"","rubric":[]},{"type":"single_choice","skill":"reading","section":"reading_comprehension","prompt":"What does the author advise us to do concerning ambition?","passage":"Most of us in the entrepreneurial community are blessed — or cursed — with higher-than-average ambition. Ambitious people strongly desire accomplishments and are willing to take more risks and spend more effort to get them.\n\nOverall, this is a positive quality, especially for people trying to build their own businesses. Apparently, if you're more naturally driven to set goals, you are more likely to succeed\n\nActually, this isn't always the case. In fact, in some cases, extreme ambition may end up doing more harm than good.\n\nOne major side effect of excessive ambition is the tendency to focus too determinedly on one particular vision or end goal. This is problematic because it hinders your ability to adapt to new circumstances, which is vital if you want to be a successful entrepreneur. If a new competitor emerges to threaten your business, you may need to change direction, even if that means straying from your original vision. If you have too much ambition, you'll find this hard, if not impossible.\n\nFew people are successful when they try to build their first brand. Unfortunately, for the most ambitious entrepreneurs, a failure is seen as disastrous, and impossible to recover from.\n\nIt's a clear departure from the intended plan toward the intended goal. For people with limited ambition, however, failure is viewed as something closer to reality. Remember, failure is inevitable, and every failure you survive is a learning experience.\n\nAmbitious people tend to be more materialistically successful than their non-ambitious counterparts. However, they're only slightly happier than their less-ambitious counterparts, and tend to live significantly shorter lives. This implies that even though ambitious people are more likely to achieve conventional “success,” such success means nothing for their health and happiness — and if you don't have health and happiness, what else could possibly matter?\n\nClearly, some amount of ambition is good for your motivation. Without any ambition, you wouldn't start your own business, set or achieve goals and get far in life. But an excess of ambition can also be dangerous, putting you at risk of burnout, stubbornness and even a shorter life.","options":[{"id":"A","text":"Distinguish between conventional success and our life goal."},{"id":"B","text":"Follow the example of the most ambitious entrepreneurs."},{"id":"C","text":"Avoid taking unnecessary risks when starting a business."},{"id":"D","text":"Prioritize health and happiness over material success."}],"id":"cet4-2023-06-1-q55","number":55,"level":"CET4","correctAnswer":"D","hint":"关注健康、幸福与传统成功的价值比较。","explanation":"D。第七段说有野心者较可能取得物质成功，但这不保证健康幸福，并反问缺了二者其他还有何意义。由此可知应优先健康幸福，而不是一味模仿极端野心或只讨论创业风险。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q55","referenceAnswer":"","rubric":[]},{"id":"cet4-2023-06-1-translation","number":"IV","level":"CET4","section":"translation","skill":"translation","type":"short_text_self_check","prompt":"Directions: For this part, you are allowed 30 minutes to translate a passage from Chinese into English. You should write your answer on Answer Sheet 2.\n\n中国越来越重视终身教育，发展继续教育是构建终身教育体系的有效途径。高校作为人才培养的基地，拥有先进的教学理念和优越的教学资源，理应成为继续教育的办学主体。因此，近年来许多高校适应社会需求，加强与用人单位沟通，努力探索一条符合中国国情的继续教育发展新路，以使继续教育在国家发展战略中发挥更大的作用。","options":[],"hint":"先分清终身教育与继续教育，再把高校优势、实施措施和目的串联起来。","explanation":"真实段落按价值、主体、行动、目的展开。lifelong education与continuing education不能混为同一概念；高校拥有教学理念和资源，因而应承担主要办学责任。末句措施包括回应社会需求、加强雇主沟通和探索符合国情的道路，最后用so that表达发挥作用的目的。参考译文以一般现在时说明事实、现在完成进行或完成时描述近年来探索，允许准确自然的其他译法。","correctAnswer":"China is attaching increasing importance to lifelong education, and developing continuing education is an effective way to establish a lifelong education system. As institutions that cultivate talent, universities have advanced educational ideas and excellent teaching resources, and should therefore be the main providers of continuing education. In recent years, many universities have responded to social needs, strengthened communication with employers, and worked to explore a new path for continuing education that fits China's circumstances, so that it can play a greater role in the country's development strategy.","referenceAnswer":"China is attaching increasing importance to lifelong education, and developing continuing education is an effective way to establish a lifelong education system. As institutions that cultivate talent, universities have advanced educational ideas and excellent teaching resources, and should therefore be the main providers of continuing education. In recent years, many universities have responded to social needs, strengthened communication with employers, and worked to explore a new path for continuing education that fits China's circumstances, so that it can play a greater role in the country's development strategy.","rubric":["区分终身教育和继续教育","完整译出高校的理念与资源优势","保留社会需求、用人单位沟通和国情三个要点","表达在国家发展战略中发挥更大作用的目的"],"guidance":"参考范文为本项目编写，允许其他正确表达；完成后按要点自评，不计入客观正确率。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-translation","passage":""}],"answers":[],"drafts":{}},"question":{"type":"single_choice","skill":"reading","section":"阅读理解 · 仔细阅读","prompt":"What are big houses promoted to be in the United States?","passage":"The United States is facing a housing crisis: Affordable housing is inadequate, while luxury homes abound (充裕), and homelessness remains a persistent problem. Despite this, popular culture and the housing industry market happiness as living with both more space and more amenities (便利设施). Big houses are adverted as a reward for hard work and diligence, turning housing from a basic necessity into a luxury.\n\nThis is reflected in our homes. The average single-family home built in the United States before 1970 was less than 1,500 square feet in size. By 2016, the average size of a new, single-family home was 2,422 square feet. What's more, homes built in the 2000s were more likely than earlier models to have more of all types of spaces: bedrooms, bathrooms, living rooms, dining rooms, recreation rooms and garages.\n\nThere are consequences of living big. As middle-class houses have grown larger, two things have happened. First, large houses take time to maintain, so cleaners and other low-wage service workers are required to keep these houses in order. Second, once-public spaces, where people from diverse backgrounds used to come together, have increasingly become privatized, leading to a reduction in the number of public facilities available to all, and a reduced quality of life for many. Take swimming pools. While in 1950, only 2,500 U.S. families owned pools, by 1999 this number was 4 million. At the same time, public municipal pools were often closed, leaving low-income people nowhere to swim.\n\nThe trend for bigger housing thus poses ethical questions. Should Americans accept a system in which the middle and upper classes enjoy a luxurious lifestyle, using the low-wage labor of others? Are we willing to accept a system in which an increase in amenities purchased by the affluent means a reduction in amenities for the poor?\n\nI believe neither is acceptable. We must change the way we think: living well does not need to mean having more private spaces; instead, it could mean having more public spaces. A better goal than building bigger houses for some is to create more publicly accessible spaces and amenities for all.","options":[{"id":"A","text":"A luxury for the homeless."},{"id":"B","text":"A reward for industriousness."},{"id":"C","text":"An abundant source of comforts."},{"id":"D","text":"An absolute necessity for happiness."}],"id":"cet4-2023-06-1-q46","number":46,"level":"CET4","correctAnswer":"B","hint":"找首段广告如何把大房子与勤奋工作联系起来。","explanation":"B。首段“a reward for hard work and diligence”直接对应a reward for industriousness。作者在描述营销说法，不是在主张无家可归者应获得奢侈品或所有幸福都依赖豪宅。","authenticity":"past_exam","sourceId":"cet4-2023-06-1","canonicalId":"cet4-2023-06-1-q46","referenceAnswer":"","rubric":[],"numberLabel":"第 46 题","materialImages":[]},"answer":"","feedback":null,"hint":"","hintLoading":false,"savedNote":"","result":null,"review":[],"navigation":[{"id":"cet4-2023-06-1-writing","index":0,"number":"I","section":"写作","checked":false},{"id":"cet4-2023-06-1-q26","index":1,"number":26,"section":"阅读理解 · 选词填空","checked":false},{"id":"cet4-2023-06-1-q27","index" osition:absolute; left:22%; right:22%; bottom:3%; height:8%; border-radius:50%; background:radial-gradient(ellipse,#9dabc538,transparent 72%); }\n.companion-figure { position:absolute; inset:0; transform-origin:50% 92%; animation:companion-idle 3.8s ease-in-out infinite; }\n.companion-layer { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }\n.companion-body { z-index:1; }.companion-outfit { z-index:2; }.companion-shoes { z-index:3; }.companion-accessory { z-index:4; }\n.companion-dialogue { position:absolute; z-index:6; left:50%; bottom:96%; transform:translateX(-50%); width:240rpx; box-sizing:border-box; padding:12rpx 16rpx; border:2rpx solid #edcddd; border-radius:22rpx; background:#fff9fdef; color:#a5748f; box-shadow:0 5rpx 20rpx #b9809d15; font-size:22rpx; line-height:1.6; text-align:center; }\n.companion-motion--wobble .companion-figure { animation:companion-wobble .55s ease-in-out 3; }\n.companion-motion--hop .companion-figure { animation:companion-hop .7s ease-in-out 2; }\n.companion-motion--nod .companion-figure { animation:companion-nod .45s ease-in-out 4; }\n.companion-stage--paused .companion-figure,.companion-stage--paused .companion-food,.companion-stage--paused .companion-heart { animation-play-state:paused; }\n.companion-empty { height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:12rpx; text-align:center; color:#8a99b0; font-size:20rpx; }\n.companion-empty-symbol { font-size:64rpx; color:#b3c3df; }\n.companion-reaction { position:absolute; z-index:5; top:0; right:-8rpx; display:flex; align-items:center; gap:4rpx; border:1rpx solid #e5cfdc; border-radius:22rpx; background:#fff7fc; padding:8rpx 12rpx; color:#a5788d; font-size:20rpx; animation:reaction-appear 1.8s ease both; white-space:nowrap; }\n.companion-food { position:absolute; z-index:5; left:10%; top:58%; font-size:44rpx; animation:food-to-face 1.8s ease both; }\n.companion-heart { position:absolute; z-index:5

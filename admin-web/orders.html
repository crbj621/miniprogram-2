<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理 - 智慧校园管理后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <h1 class="page-title">订单管理</h1>
      </div>

      <div class="stats-grid">
        <div class="stat-card primary">
          <div class="stat-icon">🛒</div>
          <div class="stat-value" id="todayOrders">0</div>
          <div class="stat-label">今日订单</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">💰</div>
          <div class="stat-value" id="todayRevenue">¥0</div>
          <div class="stat-label">今日营收</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">⏳</div>
          <div class="stat-value" id="pendingOrders">0</div>
          <div class="stat-label">待处理</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-value" id="completedOrders">0</div>
          <div class="stat-label">已完成</div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索订单号或用户名...">
            <select class="filter-select" id="statusFilter">
              <option value="">全部状态</option>
              <option value="pending">待处理</option>
              <option value="confirmed">已确认</option>
              <option value="preparing">制作中</option>
              <option value="ready">待取餐</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
            <input type="date" class="filter-select" id="dateFilter">
            <button class="btn btn-primary" onclick="searchOrders()">搜索</button>
            <button class="btn btn-secondary" onclick="exportOrders()">导出</button>
          </div>

          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>订单号</th>
                  <th>用户</th>
                  <th>菜品</th>
                  <th>金额</th>
                  <th>状态</th>
                  <th>取餐时间</th>
                  <th>下单时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="orderList">
                <tr>
                  <td colspan="8" class="empty-state">
                    <div class="icon">📭</div>
                    <div class="text">暂无订单</div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    let currentPage = 1;
    let totalPages = 1;
    let orders = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const admin = checkAuth();
      if (!admin) return;
      
      initSidebar('orders');
      await loadStats();
      await loadOrders();
    });

    async function loadStats() {
      try {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const [todayRes, pendingRes, completedRes] = await Promise.all([
          db.collection('food_order').where({
            createTime: db.command.gte(today)
          }).get(),
          db.collection('food_order').where({ status: 'pending' }).count(),
          db.collection('food_order').where({ status: 'completed' }).count()
        ]);

        const todayOrders = todayRes.data || [];
        const todayRevenue = todayOrders.reduce((sum, o) => sum + (o.totalPrice || 0), 0);

        document.getElementById('todayOrders').textContent = todayOrders.length;
        document.getElementById('todayRevenue').textContent = '¥' + todayRevenue.toFixed(2);
        document.getElementById('pendingOrders').textContent = pendingRes.total || 0;
        document.getElementById('completedOrders').textContent = completedRes.total || 0;
      } catch (err) {
        console.error('加载统计失败:', err);
      }
    }

    async function loadOrders(page = 1) {
      try {
        showLoading();
        currentPage = page;

        const keyword = document.getElementById('searchInput').value;
        const status = document.getElementById('statusFilter').value;
        const date = document.getElementById('dateFilter').value;

        let query = {};
        if (status) query.status = status;
        if (date) {
          const start = new Date(date);
          const end = new Date(date);
          end.setDate(end.getDate() + 1);
          query.createTime = db.command.gte(start).and(db.command.lt(end));
        }

        const countRes = await db.collection('food_order').where(query).count();
        totalPages = Math.ceil(countRes.total / CONFIG.pageSize);

        const res = await db.collection('food_order')
          .where(query)
          .orderBy('createTime', 'desc')
          .skip((page - 1) * CONFIG.pageSize)
          .limit(CONFIG.pageSize)
          .get();

        orders = res.data;

        if (keyword) {
          orders = orders.filter(o => 
            (o.orderNo && o.orderNo.includes(keyword)) || 
            (o.userName && o.userName.includes(keyword)) ||
            (o.userPhone && o.userPhone.includes(keyword))
          );
        }

        renderOrders();
        renderPagination(document.getElementById('pagination'), page, totalPages, loadOrders);
        
        hideLoading();
      } catch (err) {
        hideLoading();
        console.error('加载订单失败:', err);
        showToast('加载失败', 'error');
      }
    }

    function renderOrders() {
      const tbody = document.getElementById('orderList');
      
      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><div class="icon">📭</div><div class="text">暂无订单</div></td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(order => `
        <tr>
          <td><strong>${order.orderNo || order._id.substring(0, 8)}</strong></td>
          <td>
            <div>${order.userName || '-'}</div>
            <div style="font-size: 12px; color: #999;">${order.userPhone || ''}</div>
          </td>
          <td>
            <div style="max-width: 200px;">
              ${(order.items || []).map(item => `<div>${item.name} x${item.count}</div>`).join('')}
            </div>
          </td>
          <td><strong>¥${order.totalPrice || 0}</strong></td>
          <td><span class="status-tag ${getStatusClass(order.status)}">${ORDER_STATUS[order.status] || order.status}</span></td>
          <td>${order.pickupTime || '-'}</td>
          <td>${formatDate(order.createTime)}</td>
          <td>
            <div class="btn-group">
              <button class="btn btn-secondary btn-sm" onclick="viewOrder('${order._id}')">详情</button>
              ${order.status === 'pending' ? `<button class="btn btn-primary btn-sm" onclick="confirmOrder('${order._id}')">确认</button>` : ''}
              ${order.status !== 'completed' && order.status !== 'cancelled' ? `<button class="btn btn-danger btn-sm" onclick="cancelOrder('${order._id}')">取消</button>` : ''}
            </div>
          </td>
        </tr>
      `).join('');
    }

    function getStatusClass(status) {
      const map = {
        'pending': 'warning',
        'confirmed': 'info',
        'preparing': 'info',
        'ready': 'success',
        'completed': 'success',
        'cancelled': 'danger'
      };
      return map[status] || 'info';
    }

    function searchOrders() {
      loadOrders(1);
    }

    async function viewOrder(id) {
      const order = orders.find(o => o._id === id);
      if (!order) return;

      const itemsHtml = (order.items || []).map(item => `
        <tr>
          <td>${item.name}</td>
          <td>¥${item.price}</td>
          <td>${item.count}</td>
          <td>¥${(item.price * item.count).toFixed(2)}</td>
        </tr>
      `).join('');

      await showModal({
        title: '订单详情',
        content: `
          <div class="form-group">
            <label>订单号</label>
            <p>${order.orderNo || order._id}</p>
          </div>
          <div class="form-group">
            <label>用户信息</label>
            <p>${order.userName || '-'} (${order.userPhone || '-'})</p>
          </div>
          <div class="form-group">
            <label>菜品明细</label>
            <table class="data-table">
              <thead><tr><th>菜品</th><th>单价</th><th>数量</th><th>小计</th></tr></thead>
              <tbody>${itemsHtml}</tbody>
            </table>
          </div>
          <div class="form-group">
            <label>订单金额</label>
            <p style="font-size: 20px; font-weight: bold; color: #ff4d4f;">¥${order.totalPrice || 0}</p>
          </div>
          <div class="form-group">
            <label>取餐时间</label>
            <p>${order.pickupTime || '-'}</p>
          </div>
          <div class="form-group">
            <label>备注</label>
            <p>${order.remark || '无'}</p>
          </div>
          <div class="form-group">
            <label>订单状态</label>
            <p><span class="status-tag ${getStatusClass(order.status)}">${ORDER_STATUS[order.status] || order.status}</span></p>
          </div>
          <div class="form-group">
            <label>下单时间</label>
            <p>${formatDate(order.createTime)}</p>
          </div>
        `,
        footer: false
      });
    }

    async function confirmOrder(id) {
      try {
        showLoading();
        await db.collection('food_order').doc(id).update({
          status: 'confirmed',
          confirmTime: new Date()
        });
        showToast('订单已确认', 'success');
        await loadStats();
        await loadOrders(currentPage);
      } catch (err) {
        hideLoading();
        showToast('操作失败', 'error');
      }
    }

    async function cancelOrder(id) {
      const confirmed = await showConfirm('确定要取消此订单吗？');
      if (!confirmed) return;

      try {
        showLoading();
        await db.collection('food_order').doc(id).update({
          status: 'cancelled',
          cancelTime: new Date()
        });
        showToast('订单已取消', 'success');
        await loadStats();
        await loadOrders(currentPage);
      } catch (err) {
        hideLoading();
        showToast('操作失败', 'error');
      }
    }

    function exportOrders() {
      if (orders.length === 0) {
        showToast('暂无数据可导出', 'warning');
        return;
      }

      let csv = '订单号,用户,手机号,菜品,金额,状态,取餐时间,下单时间\n';
      orders.forEach(order => {
        const items = (order.items || []).map(i => `${i.name}x${i.count}`).join(';');
        csv += `${order.orderNo || order._id},${order.userName || ''},${order.userPhone || ''},"${items}",${order.totalPrice || 0},${ORDER_STATUS[order.status] || order.status},${order.pickupTime || ''},${formatDate(order.createTime)}\n`;
      });

      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `orders_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      
      showToast('导出成功', 'success');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据清理 - 智慧校园管理后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <h1 class="page-title">数据清理</h1>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">存储空间概览</h3>
        </div>
        <div class="card-body">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon">📝</div>
              <div class="stat-value" id="postCount">0</div>
              <div class="stat-label">校园动态</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">💬</div>
              <div class="stat-value" id="commentCount">0</div>
              <div class="stat-label">动态评论</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">🛒</div>
              <div class="stat-value" id="orderCount">0</div>
              <div class="stat-label">订餐订单</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">🖼️</div>
              <div class="stat-value" id="imageCount">0</div>
              <div class="stat-label">云存储文件</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">一键清理</h3>
        </div>
        <div class="card-body">
          <div class="cleanup-section">
            <h3>🗑️ 清理已删除的动态</h3>
            <div class="cleanup-item">
              <div class="info">
                <h4>已删除动态</h4>
                <p>这些动态已被标记删除，清理后将永久移除</p>
              </div>
              <div class="count" id="deletedPostCount">0</div>
              <button class="btn btn-danger" onclick="cleanDeletedPosts()">清理</button>
            </div>
          </div>

          <div class="cleanup-section">
            <h3>📅 按时间清理</h3>
            <div class="form-row">
              <div class="form-group">
                <label>清理类型</label>
                <select id="cleanType">
                  <option value="forum_post">校园动态</option>
                  <option value="forum_comment">动态评论</option>
                  <option value="food_order">订餐订单</option>
                </select>
              </div>
              <div class="form-group">
                <label>保留天数</label>
                <select id="keepDays">
                  <option value="30">保留最近30天</option>
                  <option value="60">保留最近60天</option>
                  <option value="90">保留最近90天</option>
                  <option value="180">保留最近180天</option>
                  <option value="365">保留最近1年</option>
                </select>
              </div>
              <div class="form-group" style="display: flex; align-items: flex-end;">
                <button class="btn btn-warning" onclick="cleanByDate()">按时间清理</button>
              </div>
            </div>
          </div>

          <div class="cleanup-section">
            <h3>🖼️ 清理云存储图片</h3>
            <div class="cleanup-item">
              <div class="info">
                <h4>无引用图片</h4>
                <p>清理未被动态、菜品等引用的孤立图片文件</p>
              </div>
              <button class="btn btn-danger" onclick="cleanOrphanImages()">清理孤立图片</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">批量操作</h3>
        </div>
        <div class="card-body">
          <div class="cleanup-section">
            <h3>📊 数据统计重置</h3>
            <div class="form-row">
              <div class="form-group">
                <label>操作类型</label>
                <select id="resetType">
                  <option value="post_stats">重置动态统计数据</option>
                  <option value="user_stats">重置用户统计数据</option>
                </select>
              </div>
              <div class="form-group" style="display: flex; align-items: flex-end;">
                <button class="btn btn-secondary" onclick="resetStats()">执行</button>
              </div>
            </div>
          </div>

          <div class="cleanup-section">
            <h3>⚠️ 危险操作</h3>
            <div class="cleanup-item" style="background: #fff2f0;">
              <div class="info">
                <h4 style="color: #ff4d4f;">清空所有动态</h4>
                <p>此操作不可恢复，请谨慎操作！</p>
              </div>
              <button class="btn btn-danger" onclick="clearAllPosts()">清空全部</button>
            </div>
            <div class="cleanup-item" style="background: #fff2f0;">
              <div class="info">
                <h4 style="color: #ff4d4f;">清空所有订单</h4>
                <p>此操作不可恢复，请谨慎操作！</p>
              </div>
              <button class="btn btn-danger" onclick="clearAllOrders()">清空全部</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">清理日志</h3>
        </div>
        <div class="card-body">
          <div id="cleanLog" style="max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; background: #f5f5f5; padding: 15px; border-radius: 8px;">
            <p style="color: #999;">暂无清理记录</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    const logs = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const admin = checkAuth();
      if (!admin) return;
      
      if (admin.role !== 'super') {
        showToast('无权限访问此页面', 'error');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
        return;
      }
      
      initSidebar('cleanup');
      await loadStats();
    });

    async function loadStats() {
      try {
        showLoading();
        
        const [posts, comments, orders, deletedPosts] = await Promise.all([
          db.collection('forum_post').count(),
          db.collection('forum_comment').count(),
          db.collection('food_order').count(),
          db.collection('forum_post').where({ status: 'deleted' }).count()
        ]);

        document.getElementById('postCount').textContent = posts.total || 0;
        document.getElementById('commentCount').textContent = comments.total || 0;
        document.getElementById('orderCount').textContent = orders.total || 0;
        document.getElementById('deletedPostCount').textContent = deletedPosts.total || 0;
        
        hideLoading();
      } catch (err) {
        hideLoading();
        console.error('加载统计失败:', err);
      }
    }

    function addLog(message, type = 'info') {
      const now = new Date().toLocaleString('zh-CN');
      const log = `[${now}] ${message}`;
      logs.unshift(log);
      
      const logEl = document.getElementById('cleanLog');
      logEl.innerHTML = logs.map(l => `<p>${l}</p>`).join('');
    }

    async function cleanDeletedPosts() {
      const confirmed = await showConfirm('确定要清理所有已删除的动态吗？此操作不可恢复！');
      if (!confirmed) return;

      try {
        showLoading();
        addLog('开始清理已删除动态...', 'info');

        const res = await db.collection('forum_post')
          .where({ status: 'deleted' })
          .get();

        if (res.data.length === 0) {
          showToast('没有需要清理的动态', 'warning');
          hideLoading();
          return;
        }

        let deleted = 0;
        for (const post of res.data) {
          try {
            await db.collection('forum_post').doc(post._id).remove();
            deleted++;
          } catch (err) {
            console.error('删除失败:', post._id);
          }
        }

        addLog(`清理完成，共删除 ${deleted} 篇动态`, 'success');
        showToast(`成功清理 ${deleted} 篇动态`, 'success');
        await loadStats();
      } catch (err) {
        hideLoading();
        addLog('清理失败: ' + err.message, 'error');
        showToast('清理失败', 'error');
      }
    }

    async function cleanByDate() {
      const type = document.getElementById('cleanType').value;
      const days = parseInt(document.getElementById('keepDays').value);
      const beforeDate = new Date(Date.now() - days * 24 * 60 * 60 * 1000);

      const typeNames = {
        'forum_post': '动态',
        'forum_comment': '评论',
        'food_order': '订单'
      };

      const confirmed = await showConfirm(`确定要清理 ${days} 天前的${typeNames[type]}吗？此操作不可恢复！`);
      if (!confirmed) return;

      try {
        showLoading();
        addLog(`开始清理 ${days} 天前的${typeNames[type]}...`, 'info');

        const res = await db.collection(type)
          .where({
            createTime: db.command.lt(beforeDate)
          })
          .get();

        if (res.data.length === 0) {
          showToast('没有需要清理的数据', 'warning');
          hideLoading();
          return;
        }

        let deleted = 0;
        const batchSize = 50;
        
        for (let i = 0; i < res.data.length; i += batchSize) {
          const batch = res.data.slice(i, i + batchSize);
          for (const item of batch) {
            try {
              await db.collection(type).doc(item._id).remove();
              deleted++;
            } catch (err) {
              console.error('删除失败:', item._id);
            }
          }
        }

        addLog(`清理完成，共删除 ${deleted} 条${typeNames[type]}`, 'success');
        showToast(`成功清理 ${deleted} 条数据`, 'success');
        await loadStats();
      } catch (err) {
        hideLoading();
        addLog('清理失败: ' + err.message, 'error');
        showToast('清理失败', 'error');
      }
    }

    async function cleanOrphanImages() {
      showToast('此功能需要云开发管理端支持', 'warning');
      addLog('孤立图片清理需要在云开发控制台手动操作', 'warning');
    }

    async function resetStats() {
      const type = document.getElementById('resetType').value;
      
      const confirmed = await showConfirm('确定要重置统计数据吗？');
      if (!confirmed) return;

      try {
        showLoading();

        if (type === 'post_stats') {
          const posts = await db.collection('forum_post').get();
          for (const post of posts.data) {
            const likes = await db.collection('forum_like').where({ postId: post._id }).count();
            const collects = await db.collection('forum_collect').where({ postId: post._id }).count();
            const comments = await db.collection('forum_comment').where({ postId: post._id, status: db.command.neq('deleted') }).count();
            
            await db.collection('forum_post').doc(post._id).update({
              likeCount: likes.total,
              collectCount: collects.total,
              commentCount: comments.total
            });
          }
          addLog('动态统计数据重置完成', 'success');
        }

        showToast('重置完成', 'success');
        hideLoading();
      } catch (err) {
        hideLoading();
        addLog('重置失败: ' + err.message, 'error');
        showToast('重置失败', 'error');
      }
    }

    async function clearAllPosts() {
      const confirmed = await showConfirm('⚠️ 危险操作！确定要清空所有动态吗？此操作不可恢复！');
      if (!confirmed) return;

      const doubleConfirm = await showConfirm('再次确认：真的要清空所有动态吗？');
      if (!doubleConfirm) return;

      try {
        showLoading();
        addLog('开始清空所有动态...', 'warning');

        const res = await db.collection('forum_post').get();
        let deleted = 0;

        for (const post of res.data) {
          try {
            await db.collection('forum_post').doc(post._id).remove();
            deleted++;
          } catch (err) {
            console.error('删除失败:', post._id);
          }
        }

        addLog(`清空完成，共删除 ${deleted} 篇动态`, 'success');
        showToast(`成功清空 ${deleted} 篇动态`, 'success');
        await loadStats();
      } catch (err) {
        hideLoading();
        addLog('清空失败: ' + err.message, 'error');
        showToast('清空失败', 'error');
      }
    }

    async function clearAllOrders() {
      const confirmed = await showConfirm('⚠️ 危险操作！确定要清空所有订单吗？此操作不可恢复！');
      if (!confirmed) return;

      const doubleConfirm = await showConfirm('再次确认：真的要清空所有订单吗？');
      if (!doubleConfirm) return;

      try {
        showLoading();
        addLog('开始清空所有订单...', 'warning');

        const res = await db.collection('food_order').get();
        let deleted = 0;

        for (const order of res.data) {
          try {
            await db.collection('food_order').doc(order._id).remove();
            deleted++;
          } catch (err) {
            console.error('删除失败:', order._id);
          }
        }

        addLog(`清空完成，共删除 ${deleted} 条订单`, 'success');
        showToast(`成功清空 ${deleted} 条订单`, 'success');
        await loadStats();
      } catch (err) {
        hideLoading();
        addLog('清空失败: ' + err.message, 'error');
        showToast('清空失败', 'error');
      }
    }
  </script>
</body>
</html>

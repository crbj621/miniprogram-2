<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 智慧校园管理后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <h1 class="page-title">用户管理</h1>
      </div>

      <div class="stats-grid">
        <div class="stat-card primary">
          <div class="stat-icon">👥</div>
          <div class="stat-value" id="totalUsers">0</div>
          <div class="stat-label">总用户数</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">✅</div>
          <div class="stat-value" id="normalUsers">0</div>
          <div class="stat-label">正常用户</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-icon">🚫</div>
          <div class="stat-value" id="bannedUsers">0</div>
          <div class="stat-label">禁言用户</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📅</div>
          <div class="stat-value" id="todayUsers">0</div>
          <div class="stat-label">今日新增</div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索用户昵称...">
            <select class="filter-select" id="statusFilter">
              <option value="">全部状态</option>
              <option value="normal">正常</option>
              <option value="banned">已禁言</option>
            </select>
            <button class="btn btn-primary" onclick="searchUsers()">搜索</button>
          </div>

          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>用户</th>
                  <th>昵称</th>
                  <th>动态数</th>
                  <th>评论数</th>
                  <th>状态</th>
                  <th>注册时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="userList">
                <tr>
                  <td colspan="7" class="empty-state">
                    <div class="icon">👥</div>
                    <div class="text">暂无用户</div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    let currentPage = 1;
    let totalPages = 1;
    let users = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const admin = checkAuth();
      if (!admin) return;
      
      initSidebar('users');
      await loadStats();
      await loadUsers();
    });

    async function loadStats() {
      try {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const [total, banned, todayRes] = await Promise.all([
          db.collection('forum_user').count(),
          db.collection('forum_user').where({ status: 'banned' }).count(),
          db.collection('forum_user').where({
            createTime: db.command.gte(today)
          }).count()
        ]);

        document.getElementById('totalUsers').textContent = total.total || 0;
        document.getElementById('normalUsers').textContent = (total.total || 0) - (banned.total || 0);
        document.getElementById('bannedUsers').textContent = banned.total || 0;
        document.getElementById('todayUsers').textContent = todayRes.total || 0;
      } catch (err) {
        console.error('加载统计失败:', err);
      }
    }

    async function loadUsers(page = 1) {
      try {
        showLoading();
        currentPage = page;

        const keyword = document.getElementById('searchInput').value;
        const status = document.getElementById('statusFilter').value;

        let query = {};
        if (status) query.status = status;

        const countRes = await db.collection('forum_user').where(query).count();
        totalPages = Math.ceil(countRes.total / CONFIG.pageSize);

        const res = await db.collection('forum_user')
          .where(query)
          .orderBy('createTime', 'desc')
          .skip((page - 1) * CONFIG.pageSize)
          .limit(CONFIG.pageSize)
          .get();

        users = res.data;

        if (keyword) {
          users = users.filter(u => u.nickname && u.nickname.includes(keyword));
        }

        await loadUserStats();
        renderUsers();
        renderPagination(document.getElementById('pagination'), page, totalPages, loadUsers);
        
        hideLoading();
      } catch (err) {
        hideLoading();
        console.error('加载用户失败:', err);
        showToast('加载失败', 'error');
      }
    }

    async function loadUserStats() {
      for (const user of users) {
        try {
          const [posts, comments] = await Promise.all([
            db.collection('forum_post').where({ _openid: user._openid, status: db.command.neq('deleted') }).count(),
            db.collection('forum_comment').where({ _openid: user._openid, status: db.command.neq('deleted') }).count()
          ]);
          user.postCount = posts.total;
          user.commentCount = comments.total;
        } catch (err) {
          user.postCount = 0;
          user.commentCount = 0;
        }
      }
    }

    function renderUsers() {
      const tbody = document.getElementById('userList');
      
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><div class="icon">👥</div><div class="text">暂无用户</div></td></tr>';
        return;
      }

      tbody.innerHTML = users.map(user => `
        <tr>
          <td>
            <div style="display: flex; align-items: center; gap: 10px;">
              <img src="${user.avatar || '/images/default-avatar.png'}" style="width: 40px; height: 40px; border-radius: 50%;">
              <div>
                <div style="font-size: 12px; color: #999;">${user._openid ? user._openid.substring(0, 10) + '...' : '-'}</div>
              </div>
            </div>
          </td>
          <td><strong>${user.nickname || '未设置'}</strong></td>
          <td>${user.postCount || 0}</td>
          <td>${user.commentCount || 0}</td>
          <td><span class="status-tag ${user.status === 'banned' ? 'danger' : 'success'}">${USER_STATUS[user.status] || '正常'}</span></td>
          <td>${formatDate(user.createTime)}</td>
          <td>
            <div class="btn-group">
              ${user.status !== 'banned' ? 
                `<button class="btn btn-danger btn-sm" onclick="banUser('${user._id}', '${user._openid}')">禁言</button>` : 
                `<button class="btn btn-success btn-sm" onclick="unbanUser('${user._id}')">解禁</button>`
              }
              <button class="btn btn-secondary btn-sm" onclick="viewUserPosts('${user._openid}')">动态</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function searchUsers() {
      loadUsers(1);
    }

    async function banUser(userId, openid) {
      const confirmed = await showConfirm('确定要禁言该用户吗？');
      if (!confirmed) return;

      try {
        showLoading();
        const banEndTime = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
        
        await db.collection('forum_user').doc(userId).update({
          status: 'banned',
          banTime: banEndTime,
          banReason: '管理员禁言'
        });

        showToast('已禁言该用户', 'success');
        await loadStats();
        await loadUsers(currentPage);
      } catch (err) {
        hideLoading();
        showToast('操作失败', 'error');
      }
    }

    async function unbanUser(userId) {
      try {
        showLoading();
        await db.collection('forum_user').doc(userId).update({
          status: 'normal',
          banTime: db.command.remove(),
          banReason: db.command.remove()
        });

        showToast('已解除禁言', 'success');
        await loadStats();
        await loadUsers(currentPage);
      } catch (err) {
        hideLoading();
        showToast('操作失败', 'error');
      }
    }

    async function viewUserPosts(openid) {
      try {
        showLoading();
        const res = await db.collection('forum_post')
          .where({ _openid: openid })
          .orderBy('createTime', 'desc')
          .limit(20)
          .get();

        const posts = res.data;
        
        if (posts.length === 0) {
          hideLoading();
          showToast('该用户暂无动态', 'warning');
          return;
        }

        const postsHtml = posts.map(post => `
          <tr>
            <td>${post.title}</td>
            <td>${getCategoryName(post.category)}</td>
            <td>👍${post.likeCount || 0} 💬${post.commentCount || 0}</td>
            <td>${formatDate(post.createTime)}</td>
          </tr>
        `).join('');

        await showModal({
          title: '用户动态',
          content: `
            <table class="data-table">
              <thead><tr><th>标题</th><th>分类</th><th>互动</th><th>时间</th></tr></thead>
              <tbody>${postsHtml}</tbody>
            </table>
          `,
          footer: false
        });
        
        hideLoading();
      } catch (err) {
        hideLoading();
        showToast('加载失败', 'error');
      }
    }

    function getCategoryName(category) {
      const map = {
        'gossip': '灌水区',
        'confession': '表白墙',
        'melon': '吃瓜',
        'job': '兼职',
        'lost': '失物招领',
        'study': '学习互助'
      };
      return map[category] || category;
    }
  </script>
</body>
</html>
